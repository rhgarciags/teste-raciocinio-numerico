<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teste de Raciocínio Numérico</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    h2 {
      line-height: 1.4;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin: 10px 0 20px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .center {
      text-align: center;
    }

    #teste,
    #resultado {
      display: none;
    }

    .topo {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      font-weight: bold;
    }

    #cronometro {
      color: #dc2626;
    }

    .alternativa {
      display: block;
      margin: 12px 0;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
    }

    .alternativa:hover {
      background: #f0f4ff;
    }

    .alternativa input {
      width: auto;
      margin: 0 10px 0 0;
    }

    .mensagem {
      text-align: center;
      margin-top: 20px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- TELA INICIAL -->

  <div id="inicio">

    <h1>Teste de Raciocínio Numérico</h1>

    <p>
      Você terá <strong>5 minutos</strong> para responder ao teste.
    </p>

    <p>
      Leia cada questão atentamente e selecione uma alternativa.
    </p>

    <label for="nome">Nome</label>

    <input
      type="text"
      id="nome"
      placeholder="Digite seu nome"
      autocomplete="name"
    >

    <div class="center">

      <button
        id="botaoIniciar"
        onclick="iniciarTeste()"
      >
        Iniciar teste
      </button>

    </div>

    <p
      id="mensagemInicio"
      class="mensagem"
    ></p>

  </div>


  <!-- TELA DO TESTE -->

  <div id="teste">

    <div class="topo">

      <span id="numeroQuestao">
        Questão 1 de 40
      </span>

      <span id="cronometro">
        05:00
      </span>

    </div>

    <h2 id="pergunta"></h2>

    <div id="alternativas"></div>

    <br>

    <button onclick="proximaQuestao()">
      Próxima
    </button>

  </div>


  <!-- TELA FINAL -->

  <div
    id="resultado"
    class="center"
  >

    <h1>Teste concluído</h1>

    <p>
      Suas respostas foram registradas.
    </p>

    <p>
      O resultado será analisado posteriormente.
    </p>

  </div>

</div>


<!-- BIBLIOTECA DO SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==================================================
   CONFIGURAÇÃO DO SUPABASE
   ================================================== */

const SUPABASE_URL =
  "https://rfzauftsgqidtzwtdjlp.supabase.co/rest/v1/";

const SUPABASE_KEY =
  "sb_publishable_QAHvlE6BbMgm5nc9WzYJEQ_7f_YvkrU";


/* ==================================================
   CONEXÃO COM O SUPABASE
   ================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   VARIÁVEIS
   ================================================== */

let nome = "";

let questaoAtual = 0;

let respostas = [];

let tempo = 300;

let intervalo = null;

let candidateId = null;

let attemptId = null;


/* ==================================================
   QUESTÕES TEMPORÁRIAS
   ==================================================

   Estas serão substituídas posteriormente
   pelas suas 40 questões.
   ================================================== */

const questoes = [

  {
    pergunta:
      "Uma empresa vendeu 250 unidades em janeiro e 300 em fevereiro. Qual foi o aumento percentual?",

    alternativas: [
      "10%",
      "15%",
      "20%",
      "25%"
    ],

    correta: 2
  },

  {
    pergunta:
      "Quanto é 15% de 200?",

    alternativas: [
      "20",
      "25",
      "30",
      "35"
    ],

    correta: 2
  },

  {
    pergunta:
      "Se 5 produtos custam R$ 100, quanto custam 8 produtos pelo mesmo preço unitário?",

    alternativas: [
      "R$ 120",
      "R$ 140",
      "R$ 160",
      "R$ 180"
    ],

    correta: 2
  }

];


/* ==================================================
   INICIAR TESTE
   ================================================== */

async function iniciarTeste() {

  nome =
    document
      .getElementById("nome")
      .value
      .trim();


  if (!nome) {

    alert("Digite seu nome para iniciar.");

    return;
  }


  const botao =
    document.getElementById("botaoIniciar");

  botao.disabled = true;


  document.getElementById(
    "mensagemInicio"
  ).textContent =
    "Iniciando teste...";


  try {

    /* CADASTRA O CANDIDATO */

    const resultadoCandidato =
      await supabaseClient
        .from("candidates")
        .insert({
          name: nome
        })
        .select()
        .single();


    if (resultadoCandidato.error) {

      console.error(
        resultadoCandidato.error
      );

      throw new Error(
        "Não foi possível registrar o candidato."
      );
    }


    candidateId =
      resultadoCandidato.data.id;


    /* CRIA A TENTATIVA */

    const resultadoTentativa =
      await supabaseClient
        .from("attempts")
        .insert({
          candidate_id: candidateId,
          total_questions: 40
        })
        .select()
        .single();


    if (resultadoTentativa.error) {

      console.error(
        resultadoTentativa.error
      );

      throw new Error(
        "Não foi possível iniciar a tentativa."
      );
    }


    attemptId =
      resultadoTentativa.data.id;


    /* MOSTRA O TESTE */

    document.getElementById(
      "inicio"
    ).style.display =
      "none";


    document.getElementById(
      "teste"
    ).style.display =
      "block";


    questaoAtual = 0;

    respostas = [];

    tempo = 300;


    mostrarQuestao();

    atualizarCronometro();


    intervalo =
      setInterval(
        atualizarCronometro,
        1000
      );


  } catch (erro) {

    console.error(erro);


    alert(
      "Não foi possível iniciar o teste. Verifique a configuração do Supabase."
    );


    botao.disabled = false;


    document.getElementById(
      "mensagemInicio"
    ).textContent = "";

  }

}


/* ==================================================
   MOSTRAR QUESTÃO
   ================================================== */

function mostrarQuestao() {

  const q =
    questoes[questaoAtual];


  document.getElementById(
    "numeroQuestao"
  ).textContent =
    `Questão ${questaoAtual + 1} de 40`;


  document.getElementById(
    "pergunta"
  ).textContent =
    q.pergunta;


  const container =
    document.getElementById(
      "alternativas"
    );


  container.innerHTML = "";


  q.alternativas.forEach(
    (alternativa, index) => {

      const label =
        document.createElement("label");


      label.className =
        "alternativa";


      label.innerHTML = `
        <input
          type="radio"
          name="resposta"
          value="${index}"
        >
        ${alternativa}
      `;


      container.appendChild(label);

    }
  );

}


/* ==================================================
   PRÓXIMA QUESTÃO
   ================================================== */

async function proximaQuestao() {

  const selecionada =
    document.querySelector(
      'input[name="resposta"]:checked'
    );


  if (!selecionada) {

    alert(
      "Selecione uma alternativa."
    );

    return;
  }


  const resposta =
    Number(
      selecionada.value
    );


  respostas[questaoAtual] =
    resposta;


  questaoAtual++;


  if (
    questaoAtual >=
    questoes.length
  ) {

    await finalizarTeste();

    return;
  }


  mostrarQuestao();

}


/* ==================================================
   CRONÔMETRO
   ================================================== */

function atualizarCronometro() {

  const minutos =
    Math.floor(
      tempo / 60
    );


  const segundos =
    tempo % 60;


  document.getElementById(
    "cronometro"
  ).textContent =
    `${String(minutos).padStart(2, "0")}:${String(segundos).padStart(2, "0")}`;


  if (tempo <= 0) {

    finalizarTeste();

    return;
  }


  tempo--;

}


/* ==================================================
   FINALIZAR TESTE
   ================================================== */

async function finalizarTeste() {

  if (intervalo) {

    clearInterval(intervalo);

    intervalo = null;

  }


  /* CALCULA OS ACERTOS */

  let acertos = 0;


  respostas.forEach(
    (resposta, index) => {

      if (
        questoes[index] &&
        resposta ===
          questoes[index].correta
      ) {

        acertos++;

      }

    }
  );


  /* SALVA O RESULTADO */

  if (attemptId) {

    const resultado =
      await supabaseClient
        .from("attempts")
        .update({

          score: acertos,

          finished_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          attemptId
        );


    if (resultado.error) {

      console.error(
        resultado.error
      );

    }

  }


  /* NÃO MOSTRA A PONTUAÇÃO */

  document.getElementById(
    "teste"
  ).style.display =
    "none";


  document.getElementById(
    "resultado"
  ).style.display =
    "block";

}

</script>

</body>
</html>
