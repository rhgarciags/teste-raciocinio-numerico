/* =====================================================
   INICIAR TESTE
   ===================================================== */

async function iniciarTeste() {

  const campoNome =
    document.getElementById("nome");

  nome =
    campoNome.value.trim();


  if (!nome) {

    mostrarMensagem(
      "Digite seu nome para iniciar."
    );

    return;
  }


  const botao =
    document.getElementById(
      "botaoIniciar"
    );

  botao.disabled = true;


  mostrarMensagem(
    "Registrando candidato..."
  );


  try {

    /* -----------------------------------------------
       1. CADASTRA O CANDIDATO
       ----------------------------------------------- */

    const respostaCandidato =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/candidates",
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json",
            "Prefer":
              "return=representation"
          },

          body: JSON.stringify({
            name: nome
          })
        }
      );


    const textoCandidato =
      await respostaCandidato.text();


    if (!respostaCandidato.ok) {

      throw new Error(
        "Erro ao cadastrar candidato: " +
        respostaCandidato.status +
        " - " +
        textoCandidato
      );

    }


    let dadosCandidato;

    try {

      dadosCandidato =
        JSON.parse(textoCandidato);

    } catch (e) {

      throw new Error(
        "O Supabase não retornou os dados do candidato."
      );

    }


    if (
      !Array.isArray(dadosCandidato) ||
      dadosCandidato.length === 0
    ) {

      throw new Error(
        "O candidato foi enviado, mas o ID não foi retornado."
      );

    }


    candidatoId =
      dadosCandidato[0].id;


    /* -----------------------------------------------
       2. CRIA A TENTATIVA
       ----------------------------------------------- */

    mostrarMensagem(
      "Criando tentativa..."
    );


    const respostaTentativa =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/attempts",
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json",
            "Prefer":
              "return=representation"
          },

          body: JSON.stringify({

            candidate_id:
              candidatoId,

            total_questions:
              40

          })
        }
      );


    const textoTentativa =
      await respostaTentativa.text();


    if (!respostaTentativa.ok) {

      throw new Error(
        "Candidato foi registrado, mas a tentativa não pôde ser criada: " +
        respostaTentativa.status +
        " - " +
        textoTentativa
      );

    }


    let dadosTentativa;

    try {

      dadosTentativa =
        JSON.parse(textoTentativa);

    } catch (e) {

      throw new Error(
        "A tentativa foi criada, mas o ID não foi retornado."
      );

    }


    if (
      !Array.isArray(dadosTentativa) ||
      dadosTentativa.length === 0
    ) {

      throw new Error(
        "A tentativa foi criada, mas não conseguimos obter o ID."
      );

    }


    tentativaId =
      dadosTentativa[0].id;


    /* -----------------------------------------------
       3. COMEÇA O TESTE
       ----------------------------------------------- */

    document.getElementById(
      "inicio"
    ).style.display =
      "none";


    document.getElementById(
      "teste"
    ).style.display =
      "block";


    questaoAtual = 0;

    respostas = [];

    tempoRestante = 300;


    mostrarQuestao();

    atualizarCronometro();


    intervalo =
      setInterval(
        atualizarCronometro,
        1000
      );


  } catch (erro) {

    console.error(erro);


    alert(
      erro.message
    );


    botao.disabled = false;


    mostrarMensagem(
      ""
    );

  }

}


/* =====================================================
   MOSTRAR QUESTÃO
   ===================================================== */

function mostrarQuestao() {

  const questao =
    questoes[questaoAtual];


  document.getElementById(
    "numeroQuestao"
  ).textContent =
    "Questão " +
    (questaoAtual + 1) +
    " de 40";


  document.getElementById(
    "tipoQuestao"
  ).textContent =
    questao.tipo;


  document.getElementById(
    "pergunta"
  ).textContent =
    questao.pergunta;


  const alternativas =
    document.getElementById(
      "alternativas"
    );


  alternativas.innerHTML =
    "";


  questao.alternativas.forEach(
    function(
      alternativa,
      indice
    ) {

      const label =
        document.createElement(
          "label"
        );


      label.className =
        "alternativa";


      label.innerHTML =
        `
        <input
          type="radio"
          name="resposta"
          value="${indice}"
        >
        ${alternativa}
        `;


      alternativas.appendChild(
        label
      );

    }
  );


  const percentual =
    ((questaoAtual + 1) / 40) *
    100;


  document.getElementById(
    "barraProgresso"
  ).style.width =
    percentual + "%";

}


/* =====================================================
   PRÓXIMA QUESTÃO
   ===================================================== */

function proximaQuestao() {

  const selecionada =
    document.querySelector(
      'input[name="resposta"]:checked'
    );


  if (!selecionada) {

    alert(
      "Selecione uma alternativa."
    );

    return;

  }


  respostas[questaoAtual] =
    Number(
      selecionada.value
    );


  questaoAtual++;


  if (
    questaoAtual >= 40
  ) {

    finalizarTeste();

    return;

  }


  mostrarQuestao();

}


/* =====================================================
   CRONÔMETRO
   ===================================================== */

function atualizarCronometro() {

  const minutos =
    Math.floor(
      tempoRestante / 60
    );


  const segundos =
    tempoRestante % 60;


  document.getElementById(
    "cronometro"
  ).textContent =
    String(minutos).padStart(
      2,
      "0"
    ) +
    ":" +
    String(segundos).padStart(
      2,
      "0"
    );


  if (
    tempoRestante <= 0
  ) {

    finalizarTeste();

    return;

  }


  tempoRestante--;

}


/* =====================================================
   FINALIZAR TESTE
   ===================================================== */

async function finalizarTeste() {

  if (intervalo) {

    clearInterval(
      intervalo
    );

    intervalo = null;

  }


  /* CALCULA OS ACERTOS */

  let acertos = 0;


  respostas.forEach(
    function(
      resposta,
      indice
    ) {

      if (
        resposta ===
        questoes[indice].correta
      ) {

        acertos++;

      }

    }
  );


  /* -----------------------------------------------
     ATUALIZA A TENTATIVA
     ----------------------------------------------- */

  if (tentativaId) {

    try {

      const resposta =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/attempts?id=eq." +
          encodeURIComponent(
            tentativaId
          ),
          {
            method: "PATCH",

            headers: {
              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              score:
                acertos,

              finished_at:
                new Date()
                  .toISOString()

            })
          }
        );


      if (!resposta.ok) {

        console.error(
          "Erro ao atualizar tentativa:",
          await resposta.text()
        );

      }

    } catch (erro) {

      console.error(
        "Erro ao finalizar:",
        erro
      );

    }

  }


  /* -----------------------------------------------
     MOSTRA TELA FINAL
     ----------------------------------------------- */

  document.getElementById(
    "teste"
  ).style.display =
    "none";


  document.getElementById(
    "resultado"
  ).style.display =
    "block";

}


/* =====================================================
   MENSAGEM
   ===================================================== */

function mostrarMensagem(texto) {

  document.getElementById(
    "mensagem"
  ).textContent =
    texto;

}
