    }

      margin: 0;

      color: #1f2937;
    }

    .container {
      max-width: 720px;
      margin: 40px auto;
      padding: 30px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      color: #111827;
    }

    h2 {
      line-height: 1.5;
    }

    p {
      line-height: 1.6;
    }

    label {
      font-weight: bold;
    }

    #nome {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      margin-bottom: 20px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 14px 24px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .centralizar {
      text-align: center;
    }

    #teste,
    #resultado {
      display: none;
    }

    .cabecalho-teste {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-weight: bold;
    }

    #cronometro {
      color: #dc2626;
      font-size: 20px;
    }

    .alternativa {
      display: block;
      padding: 15px;
      margin: 12px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      cursor: pointer;
      font-weight: normal;
    }

    .alternativa:hover {
      background: #eff6ff;
      border-color: #2563eb;
    }

    .alternativa input {
      margin-right: 10px;
    }

    #mensagem {
      text-align: center;
      color: #dc2626;
      margin-top: 15px;
    }

    .progresso {
      height: 8px;
      background: #e5e7eb;
      border-radius: 10px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    #barraProgresso {
      height: 100%;
      width: 2.5%;
      background: #2563eb;
      transition: width .2s;
    }

</head>

<body>

<div class="container">

  <!-- ================================
       INÍCIO
       ================================= -->

  <section id="inicio">

    </p>

    <p>

    </p>

      Informe seu nome para começar.
    </p>

    <label for="nome">Nome</label>

    <input
      type="text"
      id="nome"
      placeholder="Digite seu nome"
      autocomplete="name"
    >

    <div class="centralizar">

      <button
        id="botaoIniciar"
        onclick="iniciarTeste()"
      >
        Iniciar teste
      </button>

    </div>

    <div id="mensagem"></div>

  </section>


  <!-- ================================
       TESTE
       ================================= -->

  <section id="teste">

    <div class="cabecalho-teste">

      <span id="numeroQuestao">
        Questão 1 de 40
      </span>

      <span id="cronometro">
        05:00
      </span>

    </div>

    <div class="progresso">
      <div id="barraProgresso"></div>
    </div>

    <h2 id="pergunta"></h2>

    <div id="alternativas"></div>

    <br>

    <button onclick="proximaQuestao()">
      Próxima questão
    </button>

  </section>


  <!-- ================================
       RESULTADO
       ================================= -->

  <section id="resultado" class="centralizar">

    <h1>Teste concluído</h1>

    <p>
      Obrigado por realizar o teste.
    </p>

    <p>
      Suas respostas foram registradas.
    </p>

  </section>

</div>

/* =====================================================
   INICIAR TESTE
   ===================================================== */

async function iniciarTeste() {

  const campoNome =
    document.getElementById("nome");

  nome = campoNome.value.trim();


  if (!nome) {

    mostrarMensagem(
      "Digite seu nome para iniciar."
    );

    return;
  }


  const botao =
    document.getElementById("botaoIniciar");

  botao.disabled = true;


  mostrarMensagem(
    "Registrando candidato..."
  );


  try {

    /*
     * ENVIA O NOME PARA O SUPABASE
     */

    const resposta = await fetch(
      SUPABASE_URL + "/rest/v1/candidates",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=representation"
        },

        body: JSON.stringify({
          name: nome
        })
      }
    );


    const texto =
      await resposta.text();


    if (!resposta.ok) {

      console.error(
        "Erro Supabase:",
        resposta.status,
        texto
      );

      throw new Error(
        "Supabase " +
        resposta.status +
        ": " +
        texto
      );
    }


    let dados = null;

    try {

      dados =
        JSON.parse(texto);

    } catch (e) {

      dados = null;

    }


    if (
      Array.isArray(dados) &&
      dados.length > 0
    ) {

      candidatoId =
        dados[0].id;

    }


    /*
     * COMEÇA O TESTE
     */

    document.getElementById(
      "inicio"
    ).style.display = "none";


    document.getElementById(
      "teste"
    ).style.display = "block";


    questaoAtual = 0;

    respostas = [];

    tempoRestante = 300;


    mostrarQuestao();

    atualizarCronometro();


    intervalo =
      setInterval(
        atualizarCronometro,
        1000
      );

  }

  catch (erro) {

    console.error(erro);


    mostrarMensagem(
      "Não foi possível iniciar o teste."
    );


    /*
     * Mostra o erro real na tela.
     * Isso nos permitirá corrigir exatamente
     * o problema caso ainda exista.
     */

    alert(
      "Erro ao conectar ao Supabase:\n\n" +
      erro.message
    );


    botao.disabled = false;

  }

}


/* =====================================================
   MOSTRAR QUESTÃO
   ===================================================== */

function mostrarQuestao() {

  const questao =
    questoes[questaoAtual];


  document.getElementById(
    "numeroQuestao"
  ).textContent =
    "Questão " +
    (questaoAtual + 1) +
    " de 40";


  document.getElementById(
    "pergunta"
  ).textContent =
    questao.pergunta;


  const alternativas =
    document.getElementById(
      "alternativas"
    );


  alternativas.innerHTML = "";


  questao.alternativas.forEach(
    function(alternativa, indice) {

      const label =
        document.createElement("label");


      label.className =
        "alternativa";


      label.innerHTML =
        `
        <input
          type="radio"
          name="resposta"
          value="${indice}"
        >

        ${alternativa}
        `;


      alternativas.appendChild(label);

    }
  );


  const percentual =
    ((questaoAtual + 1) / 40) * 100;


  document.getElementById(
    "barraProgresso"
  ).style.width =
    percentual + "%";

}


/* =====================================================
   PRÓXIMA QUESTÃO
   ===================================================== */

function proximaQuestao() {

  const selecionada =
    document.querySelector(
      'input[name="resposta"]:checked'
    );


  if (!selecionada) {

    alert(
      "Selecione uma alternativa."
    );

    return;
  }


  respostas[questaoAtual] =
    Number(
      selecionada.value
    );


  questaoAtual++;


  if (
    questaoAtual >= 40
  ) {

    finalizarTeste();

    return;
  }


  mostrarQuestao();

}


/* =====================================================
   CRONÔMETRO
   ===================================================== */

function atualizarCronometro() {

  const minutos =
    Math.floor(
      tempoRestante / 60
    );


  const segundos =
    tempoRestante % 60;


  document.getElementById(
    "cronometro"
  ).textContent =
    String(minutos).padStart(2, "0") +
    ":" +
    String(segundos).padStart(2, "0");


  if (tempoRestante <= 0) {

    finalizarTeste();

    return;
  }


  tempoRestante--;

}


/* =====================================================
   FINALIZAR
   ===================================================== */

function finalizarTeste() {

  if (intervalo) {

    clearInterval(intervalo);

    intervalo = null;

  }


  document.getElementById(
    "teste"
  ).style.display = "none";


  document.getElementById(
    "resultado"
  ).style.display = "block";

}


/* =====================================================
   MENSAGEM
   ===================================================== */

function mostrarMensagem(texto) {

  document.getElementById(
    "mensagem"
  ).textContent = texto;

}

</script>
