<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    min-height: 100vh;
}

.container {
    max-width: 1150px;
    width: calc(100% - 30px);
    margin: 30px auto;
    padding: 30px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
    color: #111827;
}

#painel {
    display: none;
}

#login {
    max-width: 450px;
    margin: 0 auto;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

label {
    font-weight: bold;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.botao-sair {
    background: #dc2626;
    float: right;
}

.botao-sair:hover {
    background: #b91c1c;
}

.botao-limpar {
    background: #6b7280;
}

.botao-limpar:hover {
    background: #4b5563;
}

.botao-atualizar {
    background: #2563eb;
}

.erro {
    color: #dc2626;
    margin-top: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.usuario-logado {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 20px;
}

.topo {
    overflow: hidden;
    margin-bottom: 25px;
}

.seletor-testes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin: 25px 0;
}

.botao-teste {
    background: #f9fafb;
    color: #1f2937;
    border: 2px solid #d1d5db;
    padding: 18px;
    font-size: 16px;
    font-weight: bold;
}

.botao-teste:hover {
    background: #eff6ff;
    border-color: #2563eb;
    color: #1d4ed8;
}

.botao-teste.ativo {
    background: #2563eb;
    border-color: #2563eb;
    color: #fff;
}

.nome-teste {
    font-size: 18px;
}

.descricao-teste {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    font-weight: normal;
    opacity: .8;
}

.pesquisa {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}

.pesquisa-titulo {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

.pesquisa-linha {
    display: flex;
    gap: 10px;
    align-items: center;
}

.pesquisa-linha input {
    margin: 0;
    flex: 1;
}

.contador {
    margin-top: 12px;
    color: #6b7280;
    font-size: 14px;
}

.status-teste {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #111827;
}

.tabela-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th,
td {
    padding: 13px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
    white-space: nowrap;
}

th {
    background: #f9fafb;
}

tr:hover {
    background: #f9fafb;
}

.vazio {
    text-align: center;
    padding: 40px;
    color: #6b7280;
}

.carregando {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    background: #dcfce7;
    color: #166534;
}

.badge-razoavel {
    background: #fef3c7;
    color: #92400e;
}

.badge-mau {
    background: #fee2e2;
    color: #991b1b;
}

.badge-aproveitamento {
    background: #dbeafe;
    color: #1e40af;
}

.assinatura {
    text-align: center;
    color: #9ca3af;
    font-size: 10px;
    margin-top: 25px;
    padding-bottom: 12px;
}

@media (max-width: 700px) {

    .container {
        margin: 15px;
        padding: 20px;
        width: calc(100% - 30px);
    }

    .seletor-testes {
        grid-template-columns: 1fr;
    }

    .pesquisa-linha {
        flex-direction: column;
        align-items: stretch;
    }

    .pesquisa-linha button {
        width: 100%;
    }

    table {
        font-size: 14px;
    }
}
</style>

</head>

<body>

<div class="container">

<section id="login">

    <h1>Painel Administrativo</h1>

    <p>Acesse os resultados dos testes.</p>

    <label for="email">E-mail</label>

    <input
        type="email"
        id="email"
        placeholder="Seu e-mail"
        autocomplete="email"
    >

    <label for="senha">Senha</label>

    <input
        type="password"
        id="senha"
        placeholder="Sua senha"
        autocomplete="current-password"
    >

    <button
        onclick="entrar()"
        id="botaoEntrar"
    >
        Entrar
    </button>

    <div
        id="mensagemLogin"
        class="erro"
    ></div>

</section>


<section id="painel">

    <div class="topo">

        <button
            class="botao-sair"
            onclick="sair()"
        >
            Sair
        </button>

        <h1>Painel Administrativo</h1>

        <div
            id="usuarioLogado"
            class="usuario-logado"
        ></div>

        <p>
            Selecione o teste que deseja consultar.
        </p>

    </div>


    <div class="seletor-testes">

        <button
            id="botaoNumerico"
            class="botao-teste"
            onclick="selecionarTeste('numerico')"
        >
            <span class="nome-teste">
                Teste de Raciocínio Numérico
            </span>

            <span class="descricao-teste">
                Consultar resultados do teste numérico
            </span>
        </button>


        <button
            id="botaoNegociacao"
            class="botao-teste"
            onclick="selecionarTeste('negociacao')"
        >
            <span class="nome-teste">
                Teste de Negociação
            </span>

            <span class="descricao-teste">
                Consultar resultados de negociação
            </span>
        </button>

    </div>


    <div
        id="areaResultados"
        style="display:none;"
    >

        <div
            class="status-teste"
            id="tituloTeste"
        ></div>


        <div class="pesquisa">

            <label
                class="pesquisa-titulo"
                for="pesquisaNome"
            >
                Pesquisar candidato por nome
            </label>

            <div class="pesquisa-linha">

                <input
                    type="text"
                    id="pesquisaNome"
                    placeholder="Digite o nome do candidato..."
                    oninput="filtrarResultados()"
                >

                <button
                    class="botao-limpar"
                    onclick="limparPesquisa()"
                >
                    Limpar
                </button>

                <button
                    class="botao-atualizar"
                    onclick="atualizarResultados()"
                >
                    Atualizar
                </button>

            </div>

            <div
                id="contador"
                class="contador"
            >
                Carregando...
            </div>

        </div>


        <div
            id="status"
            class="carregando"
        >
            Carregando resultados...
        </div>


        <div class="tabela-container">

            <table>

                <thead id="cabecalhoTabela"></thead>

                <tbody id="resultados"></tbody>

            </table>

        </div>

    </div>

</section>


<div class="assinatura">
    Desenvolvido por : Wemerson Leal © 2026 - RH Garcia Supermercados.
</div>

</div>


<script>

/* ============================================================
   SUPABASE - RACIOCÍNIO NUMÉRICO
============================================================ */

const NUMERICO_URL =
    "https://rfzauftsgqidtzwtdjlp.supabase.co";

const NUMERICO_KEY =
    "sb_publishable_QAHvlE6BbMgm5nc9WzYJEQ_7f_YvkrU";


/* ============================================================
   SUPABASE - NEGOCIAÇÃO
============================================================ */

const NEGOCIACAO_URL =
    "https://wasgpxeorsmhrryrnoih.supabase.co";

const NEGOCIACAO_KEY =
    "sb_publishable_9rZ70PM0VmmkQSUfd2AiPw_tJf2XU9_";


/* ============================================================
   VARIÁVEIS
============================================================ */

let accessTokenNumerico = null;
let accessTokenNegociacao = null;

let testeAtual = null;

let todosResultados = [];


/* ============================================================
   LOGIN
============================================================ */

async function entrar() {

    const email =
        document.getElementById("email").value.trim();

    const senha =
        document.getElementById("senha").value;

    const mensagem =
        document.getElementById("mensagemLogin");

    const botao =
        document.getElementById("botaoEntrar");

    mensagem.textContent = "";

    if (!email || !senha) {

        mensagem.textContent =
            "Informe seu e-mail e senha.";

        return;
    }

    botao.disabled = true;
    botao.textContent = "Entrando...";

    try {

        /*
         * LOGIN NO SUPABASE DO RACIOCÍNIO NUMÉRICO
         */

        const respostaNumerico =
            await fetch(
                NUMERICO_URL +
                "/auth/v1/token?grant_type=password",
                {
                    method: "POST",

                    headers: {
                        "apikey": NUMERICO_KEY,
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: senha
                    })
                }
            );

        const dadosNumerico =
            await respostaNumerico.json();

        if (!respostaNumerico.ok) {

            throw new Error(
                dadosNumerico.error_description ||
                dadosNumerico.msg ||
                dadosNumerico.message ||
                "E-mail ou senha incorretos."
            );
        }

        accessTokenNumerico =
            dadosNumerico.access_token;


        /*
         * LOGIN NO SUPABASE DA NEGOCIAÇÃO
         */

        const respostaNegociacao =
            await fetch(
                NEGOCIACAO_URL +
                "/auth/v1/token?grant_type=password",
                {
                    method: "POST",

                    headers: {
                        "apikey": NEGOCIACAO_KEY,
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: senha
                    })
                }
            );

        const dadosNegociacao =
            await respostaNegociacao.json();

        if (!respostaNegociacao.ok) {

            throw new Error(
                "O usuário não está autorizado no projeto do Teste de Negociação."
            );
        }

        accessTokenNegociacao =
            dadosNegociacao.access_token;


        localStorage.setItem(
            "painel_email",
            email
        );

        localStorage.setItem(
            "painel_token_numerico",
            accessTokenNumerico
        );

        localStorage.setItem(
            "painel_token_negociacao",
            accessTokenNegociacao
        );


        mostrarPainel();

    }

    catch (erro) {

        console.error(
            "Erro no login:",
            erro
        );

        mensagem.textContent =
            erro.message;

        botao.disabled = false;
        botao.textContent = "Entrar";
    }
}


/* ============================================================
   MOSTRAR PAINEL
============================================================ */

function mostrarPainel() {

    document.getElementById("login").style.display =
        "none";

    document.getElementById("painel").style.display =
        "block";

    const email =
        localStorage.getItem("painel_email");

    document.getElementById("usuarioLogado").textContent =
        email
            ? "Usuário conectado: " + email
            : "";
}


/* ============================================================
   SELECIONAR TESTE
============================================================ */

async function selecionarTeste(teste) {

    testeAtual = teste;

    todosResultados = [];

    document.getElementById(
        "areaResultados"
    ).style.display = "block";

    document.getElementById(
        "pesquisaNome"
    ).value = "";

    document.getElementById(
        "botaoNumerico"
    ).classList.remove("ativo");

    document.getElementById(
        "botaoNegociacao"
    ).classList.remove("ativo");


    if (teste === "numerico") {

        document.getElementById(
            "botaoNumerico"
        ).classList.add("ativo");

        document.getElementById(
            "tituloTeste"
        ).textContent =
            "Resultados — Teste de Raciocínio Numérico";
    }


    if (teste === "negociacao") {

        document.getElementById(
            "botaoNegociacao"
        ).classList.add("ativo");

        document.getElementById(
            "tituloTeste"
        ).textContent =
            "Resultados — Teste de Negociação";
    }


    configurarCabecalho();

    await carregarResultados();
}


/* ============================================================
   CABEÇALHO
============================================================ */

function configurarCabecalho() {

    const cabecalho =
        document.getElementById(
            "cabecalhoTabela"
        );


    if (testeAtual === "numerico") {

        cabecalho.innerHTML = `
            <tr>
                <th>Candidato</th>
                <th>Questões</th>
                <th>Pontuação</th>
                <th>Aproveitamento</th>
                <th>Início</th>
                <th>Conclusão</th>
                <th>Status</th>
            </tr>
        `;

        return;
    }


    if (testeAtual === "negociacao") {

        cabecalho.innerHTML = `
            <tr>
                <th>Candidato</th>
                <th>Questões</th>
                <th>Pontuação</th>
                <th>Classificação</th>
                <th>Data</th>
                <th>Status</th>
            </tr>
        `;
    }
}


/* ============================================================
   CARREGAR RESULTADOS
============================================================ */

async function carregarResultados() {

    const status =
        document.getElementById("status");

    status.textContent =
        "Carregando resultados...";

    document.getElementById(
        "contador"
    ).textContent =
        "Carregando...";


    try {

        if (!testeAtual) {

            throw new Error(
                "Selecione um teste."
            );
        }


        let url;
        let chave;
        let token;
        let select;


        /*
         * ======================================================
         * RACIOCÍNIO NUMÉRICO
         * ======================================================
         *
         * Campos existentes:
         *
         * id
         * candidate_id
         * score
         * total_questions
         * started_at
         * finished_at
         *
         */

        if (testeAtual === "numerico") {

            url =
                NUMERICO_URL;

            chave =
                NUMERICO_KEY;

            token =
                accessTokenNumerico;

            select =
                "id,candidate_id,score,total_questions,started_at,finished_at,candidates(name)";
        }


        /*
         * ======================================================
         * NEGOCIAÇÃO
         * ======================================================
         *
         * Campos existentes:
         *
         * id
         * candidate_id
         * score
         * total_questions
         * classification
         * answers
         * created_at
         *
         */

        if (testeAtual === "negociacao") {

            url =
                NEGOCIACAO_URL;

            chave =
                NEGOCIACAO_KEY;

            token =
                accessTokenNegociacao;

            select =
                "id,candidate_id,score,total_questions,classification,created_at,candidates(name)";
        }


        if (!token) {

            throw new Error(
                "Sessão administrativa não encontrada."
            );
        }


        const urlCompleta =
            url +
            "/rest/v1/attempts?select=" +
            encodeURIComponent(select) +
            "&order=id.desc";


        const resposta =
            await fetch(
                urlCompleta,
                {
                    method: "GET",

                    headers: {
                        "apikey": chave,

                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const texto =
            await resposta.text();


        let dados = [];


        try {

            dados =
                texto
                    ? JSON.parse(texto)
                    : [];

        } catch {

            dados = [];
        }


        if (!resposta.ok) {

            throw new Error(
                dados.message ||
                dados.hint ||
                dados.details ||
                dados.error ||
                `HTTP ${resposta.status}`
            );
        }


        todosResultados =
            Array.isArray(dados)
                ? dados
                : [];


        status.textContent = "";

        filtrarResultados();

    }

    catch (erro) {

        console.error(
            "Erro ao carregar resultados:",
            erro
        );

        status.textContent =
            "Erro ao carregar resultados: " +
            erro.message;

        document.getElementById(
            "contador"
        ).textContent = "";
    }
}


/* ============================================================
   ATUALIZAR
============================================================ */

async function atualizarResultados() {

    await carregarResultados();
}


/* ============================================================
   FILTRAR
============================================================ */

function filtrarResultados() {

    const campo =
        document.getElementById(
            "pesquisaNome"
        );

    const texto =
        campo.value
            .trim()
            .toLowerCase();


    const filtrados =
        todosResultados.filter(
            function(tentativa) {

                const nome =
                    tentativa.candidates &&
                    tentativa.candidates.name
                        ? tentativa.candidates.name
                        : "Sem nome";


                return nome
                    .toLowerCase()
                    .includes(texto);
            }
        );


    mostrarResultados(
        filtrados
    );
}


/* ============================================================
   MOSTRAR RESULTADOS
============================================================ */

function mostrarResultados(dados) {

    const tabela =
        document.getElementById(
            "resultados"
        );

    const contador =
        document.getElementById(
            "contador"
        );

    tabela.innerHTML = "";


    if (dados.length === 0) {

        contador.textContent =
            "Nenhum candidato encontrado.";

        const colunas =
            testeAtual === "numerico"
                ? 7
                : 6;


        tabela.innerHTML = `
            <tr>
                <td
                    colspan="${colunas}"
                    class="vazio"
                >
                    Nenhum candidato encontrado.
                </td>
            </tr>
        `;

        return;
    }


    contador.textContent =
        dados.length === 1
            ? "1 resultado encontrado."
            : dados.length +
              " resultados encontrados.";


    dados.forEach(
        function(tentativa) {

            if (testeAtual === "numerico") {

                mostrarResultadoNumerico(
                    tentativa,
                    tabela
                );
            }


            if (testeAtual === "negociacao") {

                mostrarResultadoNegociacao(
                    tentativa,
                    tabela
                );
            }
        }
    );
}


/* ============================================================
   RACIOCÍNIO NUMÉRICO
============================================================ */

function mostrarResultadoNumerico(
    tentativa,
    tabela
) {

    const linha =
        document.createElement("tr");


    const nome =
        tentativa.candidates &&
        tentativa.candidates.name
            ? tentativa.candidates.name
            : "Sem nome";


    const total =
        Number(
            tentativa.total_questions || 0
        );


    const score =
        Number(
            tentativa.score || 0
        );


    let aproveitamento = "—";


    if (total > 0) {

        aproveitamento =
            Math.round(
                (score / total) * 100
            ) + "%";
    }


    const inicio =
        formatarData(
            tentativa.started_at
        );


    const conclusao =
        formatarData(
            tentativa.finished_at
        );


    const status =
        tentativa.finished_at
            ? "Concluído"
            : "Em andamento";


    linha.innerHTML = `

        <td>
            ${escaparHTML(nome)}
        </td>

        <td>
            ${total}
        </td>

        <td>
            ${score}
        </td>

        <td>
            <span class="badge badge-aproveitamento">
                ${aproveitamento}
            </span>
        </td>

        <td>
            ${inicio}
        </td>

        <td>
            ${conclusao}
        </td>

        <td>
            <span class="badge">
                ${status}
            </span>
        </td>

    `;


    tabela.appendChild(linha);
}


/* ============================================================
   NEGOCIAÇÃO
============================================================ */

function mostrarResultadoNegociacao(
    tentativa,
    tabela
) {

    const linha =
        document.createElement("tr");


    const nome =
        tentativa.candidates &&
        tentativa.candidates.name
            ? tentativa.candidates.name
            : "Sem nome";


    const total =
        Number(
            tentativa.total_questions || 0
        );


    const score =
        tentativa.score;


    const classificacao =
        tentativa.classification ||
        "—";


    const data =
        formatarData(
            tentativa.created_at
        );


    let classeBadge =
        "badge";


    if (
        classificacao ===
        "Negociador razoável"
    ) {

        classeBadge =
            "badge badge-razoavel";
    }


    if (
        classificacao ===
        "Mau Negociador"
    ) {

        classeBadge =
            "badge badge-mau";
    }


    linha.innerHTML = `

        <td>
            ${escaparHTML(nome)}
        </td>

        <td>
            ${total}
        </td>

        <td>
            ${
                score !== null &&
                score !== undefined
                    ? score
                    : "—"
            }
        </td>

        <td>

            <span class="${classeBadge}">
                ${escaparHTML(classificacao)}
            </span>

        </td>

        <td>
            ${data}
        </td>

        <td>

            <span class="badge">
                Concluído
            </span>

        </td>

    `;


    tabela.appendChild(linha);
}


/* ============================================================
   FORMATAR DATA
============================================================ */

function formatarData(valor) {

    if (!valor) {
        return "—";
    }


    const data =
        new Date(valor);


    if (
        Number.isNaN(
            data.getTime()
        )
    ) {

        return "—";
    }


    return data.toLocaleString(
        "pt-BR"
    );
}


/* ============================================================
   LIMPAR PESQUISA
============================================================ */

function limparPesquisa() {

    document.getElementById(
        "pesquisaNome"
    ).value = "";

    filtrarResultados();
}


/* ============================================================
   ESCAPAR HTML
============================================================ */

function escaparHTML(texto) {

    const div =
        document.createElement("div");

    div.textContent =
        texto == null
            ? ""
            : String(texto);

    return div.innerHTML;
}


/* ============================================================
   SAIR
============================================================ */

function sair() {

    accessTokenNumerico = null;
    accessTokenNegociacao = null;

    testeAtual = null;
    todosResultados = [];


    localStorage.removeItem(
        "painel_token_numerico"
    );

    localStorage.removeItem(
        "painel_token_negociacao"
    );

    localStorage.removeItem(
        "painel_email"
    );


    document.getElementById(
        "painel"
    ).style.display = "none";


    document.getElementById(
        "login"
    ).style.display = "block";


    document.getElementById(
        "email"
    ).value = "";


    document.getElementById(
        "senha"
    ).value = "";


    document.getElementById(
        "mensagemLogin"
    ).textContent = "";


    document.getElementById(
        "areaResultados"
    ).style.display = "none";


    document.getElementById(
        "pesquisaNome"
    ).value = "";
}


/* ============================================================
   RECUPERAR SESSÃO
============================================================ */

const tokenNumericoSalvo =
    localStorage.getItem(
        "painel_token_numerico"
    );


const tokenNegociacaoSalvo =
    localStorage.getItem(
        "painel_token_negociacao"
    );


if (
    tokenNumericoSalvo &&
    tokenNegociacaoSalvo
) {

    accessTokenNumerico =
        tokenNumericoSalvo;

    accessTokenNegociacao =
        tokenNegociacaoSalvo;

    mostrarPainel();
}

</script>
