<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    min-height: 100vh;
}

.container {
    max-width: 1150px;
    width: calc(100% - 30px);
    margin: 30px auto;
    padding: 30px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
}

#painel {
    display: none;
}

#login {
    max-width: 450px;
    margin: 30px auto;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

label {
    font-weight: bold;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.botao-sair {
    background: #dc2626;
    float: right;
}

.botao-sair:hover {
    background: #b91c1c;
}

.erro {
    color: #dc2626;
    margin-top: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.sucesso {
    color: #15803d;
    margin-top: 15px;
}

.topo {
    overflow: hidden;
    margin-bottom: 25px;
}

.usuario {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 20px;
}

.seletor {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}

.seletor-titulo {
    font-weight: bold;
    display: block;
    margin-bottom: 12px;
}

.botoes-testes {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.botao-teste {
    background: #6b7280;
}

.botao-teste.ativo {
    background: #2563eb;
}

.botao-atualizar {
    background: #059669;
}

.botao-atualizar:hover {
    background: #047857;
}

.pesquisa {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}

.pesquisa-titulo {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

.pesquisa-linha {
    display: flex;
    gap: 10px;
    align-items: center;
}

.pesquisa-linha input {
    margin: 0;
    flex: 1;
}

.botao-limpar {
    background: #6b7280;
}

.botao-limpar:hover {
    background: #4b5563;
}

.contador {
    margin-top: 12px;
    color: #6b7280;
    font-size: 14px;
}

.status {
    text-align: center;
    padding: 25px;
    color: #6b7280;
}

.tabela-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th,
td {
    padding: 13px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #f9fafb;
}

tr:hover {
    background: #f9fafb;
}

.vazio {
    text-align: center;
    padding: 40px;
    color: #6b7280;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    background: #dcfce7;
    color: #166534;
}

.badge-razoavel {
    background: #fef3c7;
    color: #92400e;
}

.badge-mau {
    background: #fee2e2;
    color: #991b1b;
}

.assinatura {
    text-align: center;
    color: #9ca3af;
    font-size: 10px;
    margin-top: 30px;
    padding-bottom: 10px;
}

@media (max-width: 700px) {

    .container {
        margin: 15px;
        padding: 20px;
        width: auto;
    }

    .pesquisa-linha {
        flex-direction: column;
        align-items: stretch;
    }

    .pesquisa-linha button {
        width: 100%;
    }

    .botoes-testes {
        flex-direction: column;
    }

    .botoes-testes button {
        width: 100%;
    }

    table {
        font-size: 14px;
    }
}

</style>

</head>

<body>

<div class="container">

<!-- =========================================================
     LOGIN
========================================================= -->

<section id="login">

    <h1>Painel Administrativo</h1>

    <p>
        Acesse os resultados dos testes.
    </p>

    <label for="email">
        E-mail
    </label>

    <input
        type="email"
        id="email"
        placeholder="Seu e-mail"
        autocomplete="email"
    >

    <label for="senha">
        Senha
    </label>

    <input
        type="password"
        id="senha"
        placeholder="Sua senha"
        autocomplete="current-password"
    >

    <button
        id="botaoEntrar"
        onclick="entrar()"
    >
        Entrar
    </button>

    <div
        id="mensagemLogin"
        class="erro"
    ></div>

</section>


<!-- =========================================================
     PAINEL
========================================================= -->

<section id="painel">

    <div class="topo">

        <button
            class="botao-sair"
            onclick="sair()"
        >
            Sair
        </button>

        <h1>
            Painel Administrativo
        </h1>

        <div
            id="usuarioLogado"
            class="usuario"
        ></div>

    </div>


    <!-- =====================================================
         SELEÇÃO DO TESTE
    ====================================================== -->

    <div class="seletor">

        <span class="seletor-titulo">
            Selecione o teste:
        </span>

        <div class="botoes-testes">

            <button
                id="botaoNumerico"
                class="botao-teste ativo"
                onclick="selecionarTeste('numerico')"
            >
                Teste de Raciocínio Numérico
            </button>

            <button
                id="botaoNegociacao"
                class="botao-teste"
                onclick="selecionarTeste('negociacao')"
            >
                Teste de Negociação
            </button>

            <button
                class="botao-atualizar"
                onclick="carregarResultados()"
            >
                Atualizar
            </button>

        </div>

    </div>


    <!-- =====================================================
         PESQUISA
    ====================================================== -->

    <div class="pesquisa">

        <label
            class="pesquisa-titulo"
            for="pesquisaNome"
        >
            Pesquisar candidato por nome
        </label>

        <div class="pesquisa-linha">

            <input
                type="text"
                id="pesquisaNome"
                placeholder="Digite o nome do candidato..."
                oninput="filtrarResultados()"
            >

            <button
                class="botao-limpar"
                onclick="limparPesquisa()"
            >
                Limpar
            </button>

        </div>

        <div
            id="contador"
            class="contador"
        >
            Carregando...
        </div>

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div
        id="status"
        class="status"
    >
        Carregando resultados...
    </div>


    <!-- =====================================================
         TABELA
    ====================================================== -->

    <div class="tabela-container">

        <table>

            <thead id="cabecalhoTabela">
            </thead>

            <tbody id="resultados">
            </tbody>

        </table>

    </div>

</section>


<div class="assinatura">
    Desenvolvido por : Wemerson Leal © 2026 - RH Garcia Supermercados.
</div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO - RACIOCÍNIO NUMÉRICO
========================================================= */

const NUMERICO_URL =
    "https://rfzauftsgqidtzwtdjlp.supabase.co";

const NUMERICO_KEY =
    "sb_publishable_QAHvlE6BbMgm5nc9WzYJEQ_7f_YvkrU";


/* =========================================================
   CONFIGURAÇÃO - NEGOCIAÇÃO
========================================================= */

const NEGOCIACAO_URL =
    "https://wasgpxeorsmhrryrnoih.supabase.co";

const NEGOCIACAO_KEY =
    "sb_publishable_9rZ70PM0VmmkQSUfd2AiPw_tJf2XU9_";


/* =========================================================
   VARIÁVEIS
========================================================= */

let testeAtual = "numerico";

let resultadosNumerico = [];

let resultadosNegociacao = [];

let tokenNumerico = null;

let tokenNegociacao = null;

let emailAtual = null;


/* =========================================================
   LOGIN NOS DOIS PROJETOS
========================================================= */

async function fazerLoginSupabase(
    url,
    key,
    email,
    senha
) {

    const resposta = await fetch(
        url +
        "/auth/v1/token?grant_type=password",
        {
            method: "POST",

            headers: {
                "apikey": key,
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: senha
            })
        }
    );

    const texto = await resposta.text();

    let dados = {};

    try {
        dados = texto
            ? JSON.parse(texto)
            : {};
    } catch {
        dados = {};
    }

    if (!resposta.ok) {

        throw new Error(
            dados.error_description ||
            dados.msg ||
            dados.message ||
            "Não foi possível fazer login."
        );

    }

    return dados;
}


/* =========================================================
   ENTRAR
========================================================= */

async function entrar() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const senha =
        document
            .getElementById("senha")
            .value;

    const mensagem =
        document.getElementById(
            "mensagemLogin"
        );

    const botao =
        document.getElementById(
            "botaoEntrar"
        );

    mensagem.textContent = "";

    if (!email || !senha) {

        mensagem.textContent =
            "Informe seu e-mail e senha.";

        return;
    }

    botao.disabled = true;

    botao.textContent =
        "Entrando...";

    try {

        /*
         * O mesmo usuário precisa existir
         * nos dois projetos Supabase.
         */

        const [loginNumerico, loginNegociacao] =
            await Promise.all([

                fazerLoginSupabase(
                    NUMERICO_URL,
                    NUMERICO_KEY,
                    email,
                    senha
                ),

                fazerLoginSupabase(
                    NEGOCIACAO_URL,
                    NEGOCIACAO_KEY,
                    email,
                    senha
                )

            ]);


        tokenNumerico =
            loginNumerico.access_token;

        tokenNegociacao =
            loginNegociacao.access_token;

        emailAtual =
            email;


        localStorage.setItem(
            "painel_email",
            email
        );


        /*
         * Não salvamos os tokens permanentemente.
         * Eles ficam somente nesta sessão da página.
         */


        mostrarPainel();

    }

    catch (erro) {

        console.error(
            "Erro no login:",
            erro
        );

        mensagem.textContent =
            "Não foi possível fazer login.\n\n" +
            erro.message;

        botao.disabled = false;

        botao.textContent =
            "Entrar";
    }

}


/* =========================================================
   MOSTRAR PAINEL
========================================================= */

function mostrarPainel() {

    document.getElementById(
        "login"
    ).style.display =
        "none";

    document.getElementById(
        "painel"
    ).style.display =
        "block";


    document.getElementById(
        "usuarioLogado"
    ).textContent =
        "Usuário conectado: " +
        emailAtual;


    selecionarTeste(
        "numerico"
    );

}


/* =========================================================
   SELECIONAR TESTE
========================================================= */

function selecionarTeste(
    teste
) {

    testeAtual =
        teste;


    const botaoNumerico =
        document.getElementById(
            "botaoNumerico"
        );

    const botaoNegociacao =
        document.getElementById(
            "botaoNegociacao"
        );


    botaoNumerico.classList.remove(
        "ativo"
    );

    botaoNegociacao.classList.remove(
        "ativo"
    );


    if (teste === "numerico") {

        botaoNumerico.classList.add(
            "ativo"
        );

    } else {

        botaoNegociacao.classList.add(
            "ativo"
        );

    }


    document.getElementById(
        "pesquisaNome"
    ).value = "";


    configurarCabecalho();

    carregarResultados();

}


/* =========================================================
   CABEÇALHO DA TABELA
========================================================= */

function configurarCabecalho() {

    const cabecalho =
        document.getElementById(
            "cabecalhoTabela"
        );


    if (testeAtual === "numerico") {

        cabecalho.innerHTML = `

            <tr>

                <th>Candidato</th>

                <th>Questões</th>

                <th>Pontuação</th>

                <th>Taxa de aproveitamento</th>

            </tr>

        `;

    } else {

        cabecalho.innerHTML = `

            <tr>

                <th>Candidato</th>

                <th>Questões</th>

                <th>Pontuação</th>

                <th>Classificação</th>

            </tr>

        `;

    }

}


/* =========================================================
   CARREGAR RESULTADOS
========================================================= */

async function carregarResultados() {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Carregando resultados...";


    try {

        if (
            !tokenNumerico ||
            !tokenNegociacao
        ) {

            throw new Error(
                "Sessão administrativa não encontrada."
            );

        }


        if (
            testeAtual === "numerico"
        ) {

            await carregarNumerico();

        } else {

            await carregarNegociacao();

        }


        status.textContent = "";

        filtrarResultados();

    }

    catch (erro) {

        console.error(
            "Erro ao carregar resultados:",
            erro
        );

        status.textContent =
            "Erro ao carregar resultados: " +
            erro.message;

        document.getElementById(
            "contador"
        ).textContent =
            "";

    }

}


/* =========================================================
   CARREGAR RACIOCÍNIO NUMÉRICO
========================================================= */

async function carregarNumerico() {

    /*
     * IMPORTANTE:
     *
     * Não usamos created_at.
     * Não usamos Started_at.
     * Não usamos Finished_at.
     *
     * Consultamos somente os campos existentes.
     */

    const url =
        NUMERICO_URL +
        "/rest/v1/attempts" +
        "?select=id,candidate_id,total_questions,score,candidates(name)" +
        "&order=id.desc";


    const resposta =
        await fetch(
            url,
            {
                method: "GET",

                headers: {

                    "apikey":
                        NUMERICO_KEY,

                    "Authorization":
                        "Bearer " +
                        tokenNumerico,

                    "Content-Type":
                        "application/json"
                }
            }
        );


    const texto =
        await resposta.text();


    let dados = [];


    try {

        dados =
            texto
                ? JSON.parse(texto)
                : [];

    }

    catch {

        dados = [];

    }


    if (!resposta.ok) {

        throw new Error(

            dados.message ||
            dados.hint ||
            dados.details ||
            "Erro ao consultar o Raciocínio Numérico."

        );

    }


    resultadosNumerico =
        Array.isArray(dados)
            ? dados
            : [];

}


/* =========================================================
   CARREGAR NEGOCIAÇÃO
========================================================= */

async function carregarNegociacao() {

    /*
     * Para negociação utilizamos:
     *
     * id
     * candidate_id
     * score
     * total_questions
     * classification
     * candidates(name)
     *
     * Não usamos created_at.
     */

    const url =
        NEGOCIACAO_URL +
        "/rest/v1/attempts" +
        "?select=id,candidate_id,total_questions,score,classification,candidates(name)" +
        "&order=id.desc";


    const resposta =
        await fetch(
            url,
            {
                method: "GET",

                headers: {

                    "apikey":
                        NEGOCIACAO_KEY,

                    "Authorization":
                        "Bearer " +
                        tokenNegociacao,

                    "Content-Type":
                        "application/json"
                }
            }
        );


    const texto =
        await resposta.text();


    let dados = [];


    try {

        dados =
            texto
                ? JSON.parse(texto)
                : [];

    }

    catch {

        dados = [];

    }


    if (!resposta.ok) {

        throw new Error(

            dados.message ||
            dados.hint ||
            dados.details ||
            "Erro ao consultar o Teste de Negociação."

        );

    }


    resultadosNegociacao =
        Array.isArray(dados)
            ? dados
            : [];

}


/* =========================================================
   FILTRAR RESULTADOS
========================================================= */

function filtrarResultados() {

    const campo =
        document.getElementById(
            "pesquisaNome"
        );


    const texto =
        campo.value
            .trim()
            .toLowerCase();


    const lista =
        testeAtual === "numerico"
            ? resultadosNumerico
            : resultadosNegociacao;


    const filtrados =
        lista.filter(
            function(item) {

                const nome =
                    item.candidates &&
                    item.candidates.name
                        ? item.candidates.name
                        : "Sem nome";


                return nome
                    .toLowerCase()
                    .includes(texto);

            }
        );


    mostrarResultados(
        filtrados
    );

}


/* =========================================================
   MOSTRAR RESULTADOS
========================================================= */

function mostrarResultados(
    dados
) {

    const tabela =
        document.getElementById(
            "resultados"
        );


    const contador =
        document.getElementById(
            "contador"
        );


    tabela.innerHTML = "";


    if (
        dados.length === 0
    ) {

        contador.textContent =
            "Nenhum candidato encontrado.";


        const colunas =
            testeAtual === "numerico"
                ? 4
                : 4;


        tabela.innerHTML = `

            <tr>

                <td
                    colspan="${colunas}"
                    class="vazio"
                >
                    Nenhum candidato encontrado.
                </td>

            </tr>

        `;

        return;

    }


    contador.textContent =
        dados.length === 1
            ? "1 resultado encontrado."
            : dados.length +
              " resultados encontrados.";


    dados.forEach(
        function(item) {

            const linha =
                document.createElement(
                    "tr"
                );


            const nome =
                item.candidates &&
                item.candidates.name
                    ? item.candidates.name
                    : "Sem nome";


            const total =
                item.total_questions ??
                0;


            const score =
                item.score ??
                "—";


            /*
             * =========================================
             * RACIOCÍNIO NUMÉRICO
             * =========================================
             */

            if (
                testeAtual === "numerico"
            ) {

                let aproveitamento =
                    "—";


                if (
                    item.score !== null &&
                    item.score !== undefined &&
                    Number(total) > 0
                ) {

                    const percentual =
                        (
                            Number(item.score) /
                            Number(total)
                        ) * 100;


                    aproveitamento =
                        percentual
                            .toFixed(1)
                            .replace(
                                ".0",
                                ""
                            ) +
                        "%";

                }


                linha.innerHTML = `

                    <td>
                        ${escaparHTML(nome)}
                    </td>

                    <td>
                        ${total}
                    </td>

                    <td>
                        ${score}
                    </td>

                    <td>
                        ${aproveitamento}
                    </td>

                `;

            }


            /*
             * =========================================
             * NEGOCIAÇÃO
             * =========================================
             */

            else {

                const classificacao =
                    item.classification ||
                    "—";


                let classe =
                    "badge";


                if (
                    classificacao
                        .toLowerCase()
                        .includes(
                            "razoável"
                        )
                ) {

                    classe =
                        "badge badge-razoavel";

                }


                if (
                    classificacao
                        .toLowerCase()
                        .includes(
                            "mau"
                        )
                ) {

                    classe =
                        "badge badge-mau";

                }


                linha.innerHTML = `

                    <td>
                        ${escaparHTML(nome)}
                    </td>

                    <td>
                        ${total}
                    </td>

                    <td>
                        ${score}
                    </td>

                    <td>

                        <span
                            class="${classe}"
                        >
                            ${escaparHTML(
                                classificacao
                            )}
                        </span>

                    </td>

                `;

            }


            tabela.appendChild(
                linha
            );

        }
    );

}


/* =========================================================
   LIMPAR PESQUISA
========================================================= */

function limparPesquisa() {

    document.getElementById(
        "pesquisaNome"
    ).value = "";


    filtrarResultados();

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(
    texto
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto === null ||
        texto === undefined
            ? ""
            : String(texto);


    return div.innerHTML;

}


/* =========================================================
   SAIR
========================================================= */

function sair() {

    tokenNumerico =
        null;

    tokenNegociacao =
        null;

    emailAtual =
        null;

    resultadosNumerico =
        [];

    resultadosNegociacao =
        [];


    document.getElementById(
        "painel"
    ).style.display =
        "none";


    document.getElementById(
        "login"
    ).style.display =
        "block";


    document.getElementById(
        "email"
    ).value =
        "";


    document.getElementById(
        "senha"
    ).value =
        "";


    document.getElementById(
        "mensagemLogin"
    ).textContent =
        "";


    document.getElementById(
        "botaoEntrar"
    ).disabled =
        false;


    document.getElementById(
        "botaoEntrar"
    ).textContent =
        "Entrar";

}


/* =========================================================
   ENTER NO CAMPO DE SENHA
========================================================= */

document
    .getElementById("senha")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                entrar();

            }

        }
    );


</script>

</body>

</html>
