<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo - Testes</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    min-height: 100vh;
}

.container {
    max-width: 1150px;
    width: calc(100% - 30px);
    margin: 30px auto;
    padding: 30px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
}

#painel {
    display: none;
}

#login {
    max-width: 450px;
    margin: 30px auto;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

label {
    font-weight: bold;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.botao-sair {
    background: #dc2626;
    float: right;
}

.botao-sair:hover {
    background: #b91c1c;
}

.botao-limpar {
    background: #6b7280;
}

.botao-limpar:hover {
    background: #4b5563;
}

.botao-atualizar {
    background: #2563eb;
}

.erro {
    color: #dc2626;
    margin-top: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.sucesso {
    color: #15803d;
    margin-top: 15px;
}

.topo {
    overflow: hidden;
    margin-bottom: 25px;
}

.usuario-logado {
    color: #6b7280;
    font-size: 14px;
    margin-top: 8px;
}

/* ==========================================
   SELEÇÃO DOS TESTES
========================================== */

.seletor-testes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.botao-teste {
    padding: 20px;
    border: 2px solid #e5e7eb;
    background: #f9fafb;
    color: #1f2937;
    border-radius: 12px;
    text-align: left;
    cursor: pointer;
    transition: .2s;
}

.botao-teste:hover {
    border-color: #2563eb;
    background: #eff6ff;
}

.botao-teste.ativo {
    border-color: #2563eb;
    background: #eff6ff;
    color: #1d4ed8;
}

.botao-teste-titulo {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
}

.botao-teste-descricao {
    font-size: 13px;
    color: #6b7280;
    font-weight: normal;
}

/* ==========================================
   PESQUISA
========================================== */

.pesquisa {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}

.pesquisa-titulo {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

.pesquisa-linha {
    display: flex;
    gap: 10px;
    align-items: center;
}

.pesquisa-linha input {
    margin: 0;
    flex: 1;
}

.contador {
    margin-top: 12px;
    color: #6b7280;
    font-size: 14px;
}

/* ==========================================
   TABELA
========================================== */

.tabela-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th,
td {
    padding: 13px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
    white-space: nowrap;
}

th {
    background: #f9fafb;
}

tr:hover {
    background: #f9fafb;
}

.vazio {
    text-align: center;
    padding: 40px;
    color: #6b7280;
}

.carregando {
    text-align: center;
    padding: 30px;
}

/* ==========================================
   BADGES
========================================== */

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    background: #dcfce7;
    color: #166534;
}

.badge-razoavel {
    background: #fef3c7;
    color: #92400e;
}

.badge-mau {
    background: #fee2e2;
    color: #991b1b;
}

/* ==========================================
   ASSINATURA
========================================== */

.assinatura {
    text-align: center;
    color: #9ca3af;
    font-size: 10px;
    margin-top: 25px;
    padding-bottom: 12px;
}

/* ==========================================
   RESPONSIVO
========================================== */

@media (max-width: 700px) {

    .container {
        margin: 15px;
        padding: 20px;
        width: auto;
    }

    .seletor-testes {
        grid-template-columns: 1fr;
    }

    .pesquisa-linha {
        flex-direction: column;
        align-items: stretch;
    }

    .pesquisa-linha button {
        width: 100%;
    }

    table {
        font-size: 14px;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- ==========================================================
     LOGIN
=========================================================== -->

<section id="login">

    <h1>Painel Administrativo</h1>

    <p>
        Acesse os resultados dos testes realizados.
    </p>

    <label for="email">
        E-mail
    </label>

    <input
        type="email"
        id="email"
        placeholder="Seu e-mail"
        autocomplete="email"
    >

    <label for="senha">
        Senha
    </label>

    <input
        type="password"
        id="senha"
        placeholder="Sua senha"
        autocomplete="current-password"
    >

    <button
        onclick="entrar()"
        id="botaoEntrar"
    >
        Entrar
    </button>

    <div
        id="mensagemLogin"
        class="erro"
    ></div>

</section>


<!-- ==========================================================
     PAINEL
=========================================================== -->

<section id="painel">

    <div class="topo">

        <button
            class="botao-sair"
            onclick="sair()"
        >
            Sair
        </button>

        <h1>
            Painel Administrativo
        </h1>

        <div
            id="usuarioLogado"
            class="usuario-logado"
        ></div>

    </div>


    <!-- ======================================================
         SELEÇÃO DO TESTE
    ======================================================= -->

    <div class="seletor-testes">

        <button
            type="button"
            class="botao-teste ativo"
            id="botaoNumerico"
            onclick="selecionarTeste('numerico')"
        >

            <div class="botao-teste-titulo">
                Teste de Raciocínio Numérico
            </div>

            <div class="botao-teste-descricao">
                Consultar resultados do teste de raciocínio numérico.
            </div>

        </button>


        <button
            type="button"
            class="botao-teste"
            id="botaoNegociacao"
            onclick="selecionarTeste('negociacao')"
        >

            <div class="botao-teste-titulo">
                Teste de Negociação
            </div>

            <div class="botao-teste-descricao">
                Consultar resultados do teste de negociação.
            </div>

        </button>

    </div>


    <!-- ======================================================
         PESQUISA
    ======================================================= -->

    <div class="pesquisa">

        <label
            class="pesquisa-titulo"
            for="pesquisaNome"
        >
            Pesquisar candidato por nome
        </label>

        <div class="pesquisa-linha">

            <input
                type="text"
                id="pesquisaNome"
                placeholder="Digite o nome do candidato..."
                oninput="filtrarResultados()"
            >

            <button
                class="botao-limpar"
                onclick="limparPesquisa()"
            >
                Limpar
            </button>

            <button
                class="botao-atualizar"
                onclick="atualizarResultados()"
            >
                Atualizar
            </button>

        </div>

        <div
            id="contador"
            class="contador"
        >
            Carregando...
        </div>

    </div>


    <!-- ======================================================
         STATUS
    ======================================================= -->

    <div
        id="status"
        class="carregando"
    >
        Carregando resultados...
    </div>


    <!-- ======================================================
         TABELA
    ======================================================= -->

    <div class="tabela-container">

        <table>

            <thead>

                <tr>

                    <th>
                        Candidato
                    </th>

                    <th>
                        Questões
                    </th>

                    <th>
                        Pontuação
                    </th>

                    <th>
                        Classificação
                    </th>

                    <th>
                        Aproveitamento
                    </th>

                    <th>
                        Data
                    </th>

                    <th>
                        Status
                    </th>

                </tr>

            </thead>

            <tbody id="resultados">
            </tbody>

        </table>

    </div>

</section>


<div class="assinatura">
    Desenvolvido por : Wemerson Leal © 2026 - RH Garcia Supermercados.
</div>

</div>


<script>

/* ============================================================
   CONFIGURAÇÃO DOS DOIS SUPABASE
============================================================ */

/*
   TESTE DE RACIOCÍNIO NUMÉRICO
   Projeto antigo
*/

const SUPABASE_NUMERICO_URL =
    "https://rfzauftsgqidtzwtdjlp.supabase.co";

const SUPABASE_NUMERICO_KEY =
    "sb_publishable_QAHvlE6BbMgm5nc9WzYJEQ_7f_YvkrU";


/*
   TESTE DE NEGOCIAÇÃO
   Projeto novo
*/

const SUPABASE_NEGOCIACAO_URL =
    "https://wxlltutgwoslyhqvbhqb.supabase.co";

const SUPABASE_NEGOCIACAO_KEY =
    "sb_publishable_xgSMPfvdpWLPjwECyOkADw_FR44UcVk";


/* ============================================================
   VARIÁVEIS
============================================================ */

let testeSelecionado = "numerico";

let todosResultados = [];

let accessTokenNumerico = null;

let accessTokenNegociacao = null;

let emailAdministrador = null;


/* ============================================================
   LOGIN
============================================================ */

async function entrar() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const senha =
        document
            .getElementById("senha")
            .value;

    const mensagem =
        document.getElementById(
            "mensagemLogin"
        );

    const botao =
        document.getElementById(
            "botaoEntrar"
        );

    mensagem.textContent = "";

    if (!email || !senha) {

        mensagem.textContent =
            "Informe seu e-mail e senha.";

        return;
    }

    botao.disabled = true;

    botao.textContent =
        "Entrando...";

    /*
       Como os dois projetos possuem o mesmo usuário
       administrativo, fazemos login nos dois projetos.
    */

    try {

        const resultadoNumerico =
            await fazerLoginSupabase(
                SUPABASE_NUMERICO_URL,
                SUPABASE_NUMERICO_KEY,
                email,
                senha
            );

        const resultadoNegociacao =
            await fazerLoginSupabase(
                SUPABASE_NEGOCIACAO_URL,
                SUPABASE_NEGOCIACAO_KEY,
                email,
                senha
            );

        accessTokenNumerico =
            resultadoNumerico.access_token;

        accessTokenNegociacao =
            resultadoNegociacao.access_token;

        emailAdministrador =
            email;

        localStorage.setItem(
            "painel_email",
            email
        );

        localStorage.setItem(
            "painel_numerico_token",
            accessTokenNumerico
        );

        localStorage.setItem(
            "painel_negociacao_token",
            accessTokenNegociacao
        );

        mostrarPainel();

    }

    catch (erro) {

        console.error(
            "Erro no login:",
            erro
        );

        mensagem.textContent =
            erro.message;

        botao.disabled = false;

        botao.textContent =
            "Entrar";
    }
}


/* ============================================================
   LOGIN EM UM SUPABASE
============================================================ */

async function fazerLoginSupabase(
    url,
    key,
    email,
    senha
) {

    const resposta =
        await fetch(
            url +
            "/auth/v1/token?grant_type=password",
            {
                method: "POST",

                headers: {
                    "apikey": key,
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        email: email,
                        password: senha
                    })
            }
        );

    const texto =
        await resposta.text();

    let dados = {};

    try {

        dados =
            texto
                ? JSON.parse(texto)
                : {};

    }

    catch {

        dados = {};
    }

    if (!resposta.ok) {

        throw new Error(
            dados.error_description ||
            dados.msg ||
            dados.message ||
            "E-mail ou senha incorretos."
        );
    }

    if (!dados.access_token) {

        throw new Error(
            "O Supabase não retornou o token de acesso."
        );
    }

    return dados;
}


/* ============================================================
   MOSTRAR PAINEL
============================================================ */

function mostrarPainel() {

    document.getElementById(
        "login"
    ).style.display =
        "none";

    document.getElementById(
        "painel"
    ).style.display =
        "block";

    const email =
        emailAdministrador ||
        localStorage.getItem(
            "painel_email"
        );

    document.getElementById(
        "usuarioLogado"
    ).textContent =
        email
            ? "Usuário conectado: " + email
            : "";

    selecionarTeste(
        testeSelecionado
    );
}


/* ============================================================
   SELECIONAR TESTE
============================================================ */

async function selecionarTeste(
    teste
) {

    testeSelecionado =
        teste;

    document.getElementById(
        "botaoNumerico"
    ).classList.toggle(
        "ativo",
        teste === "numerico"
    );

    document.getElementById(
        "botaoNegociacao"
    ).classList.toggle(
        "ativo",
        teste === "negociacao"
    );

    document.getElementById(
        "pesquisaNome"
    ).value =
        "";

    todosResultados =
        [];

    await carregarResultados();
}


/* ============================================================
   CARREGAR RESULTADOS
============================================================ */

async function carregarResultados() {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        "Carregando resultados...";

    document.getElementById(
        "contador"
    ).textContent =
        "Carregando...";

    try {

        let url;

        let key;

        let token;

        let consulta;


        /* ==================================================
           RACIOCÍNIO NUMÉRICO
        ================================================== */

        if (
            testeSelecionado ===
            "numerico"
        ) {

            url =
                SUPABASE_NUMERICO_URL;

            key =
                SUPABASE_NUMERICO_KEY;

            token =
                accessTokenNumerico;

            /*
               Estrutura do projeto antigo.
               Não usamos classification porque
               o painel antigo calculava o aproveitamento.
            */

            consulta =
                "/rest/v1/attempts" +

                "?select=id,candidate_id,total_questions,score,finished_at,candidates(name)" +

                "&order=finished_at.desc";
        }


        /* ==================================================
           NEGOCIAÇÃO
        ================================================== */

        else {

            url =
                SUPABASE_NEGOCIACAO_URL;

            key =
                SUPABASE_NEGOCIACAO_KEY;

            token =
                accessTokenNegociacao;

            /*
               Estrutura do projeto novo.
               IMPORTANTE:
               usamos finished_at e não created_at.
            */

            consulta =
                "/rest/v1/attempts" +

                "?select=id,candidate_id,total_questions,score,classification,finished_at,candidates(name)" +

                "&order=finished_at.desc";
        }


        if (!token) {

            throw new Error(
                "Sessão administrativa não encontrada."
            );
        }


        const resposta =
            await fetch(
                url + consulta,
                {
                    method: "GET",

                    headers: {

                        "apikey":
                            key,

                        "Authorization":
                            "Bearer " +
                            token,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const texto =
            await resposta.text();


        let dados = [];

        try {

            dados =
                texto
                    ? JSON.parse(texto)
                    : [];

        }

        catch {

            dados = [];
        }


        if (!resposta.ok) {

            throw new Error(

                dados.message ||
                dados.hint ||
                dados.details ||
                dados.error ||
                `HTTP ${resposta.status}`

            );
        }


        todosResultados =
            Array.isArray(dados)
                ? dados
                : [];


        status.textContent =
            "";


        filtrarResultados();

    }

    catch (erro) {

        console.error(
            "Erro ao carregar resultados:",
            erro
        );

        status.textContent =
            "Erro ao carregar resultados: " +
            erro.message;

        document.getElementById(
            "contador"
        ).textContent =
            "";
    }
}


/* ============================================================
   ATUALIZAR
============================================================ */

async function atualizarResultados() {

    await carregarResultados();

}


/* ============================================================
   FILTRAR POR NOME
============================================================ */

function filtrarResultados() {

    const campo =
        document.getElementById(
            "pesquisaNome"
        );

    const texto =
        campo.value
            .trim()
            .toLowerCase();


    const resultadosFiltrados =
        todosResultados.filter(
            function(tentativa) {

                const nome =
                    tentativa.candidates &&
                    tentativa.candidates.name
                        ? tentativa.candidates.name
                        : "Sem nome";


                return nome
                    .toLowerCase()
                    .includes(texto);
            }
        );


    mostrarResultados(
        resultadosFiltrados
    );
}


/* ============================================================
   MOSTRAR RESULTADOS
============================================================ */

function mostrarResultados(
    dados
) {

    const tabela =
        document.getElementById(
            "resultados"
        );

    tabela.innerHTML =
        "";


    const contador =
        document.getElementById(
            "contador"
        );


    if (
        dados.length === 0
    ) {

        contador.textContent =
            "Nenhum candidato encontrado.";

        tabela.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="vazio"
                >

                    Nenhum candidato encontrado.

                </td>

            </tr>

        `;

        return;
    }


    contador.textContent =
        dados.length === 1
            ? "1 resultado encontrado."
            : dados.length +
              " resultados encontrados.";


    dados.forEach(
        function(tentativa) {

            const linha =
                document.createElement(
                    "tr"
                );


            const nome =
                tentativa.candidates &&
                tentativa.candidates.name
                    ? tentativa.candidates.name
                    : "Sem nome";


            const total =
                tentativa.total_questions ||
                0;


            const score =
                tentativa.score;


            /*
               Classificação:
               - Negociação possui classification
               - Raciocínio Numérico calcula
                 uma informação de aproveitamento
            */

            let classificacao =
                "—";


            if (
                testeSelecionado ===
                "negociacao"
            ) {

                classificacao =
                    tentativa.classification ||
                    "—";

            }


            else {

                if (
                    score !== null &&
                    score !== undefined &&
                    total > 0
                ) {

                    const percentual =
                        Math.round(
                            (Number(score) /
                            Number(total)) *
                            100
                        );

                    if (
                        percentual >= 70
                    ) {

                        classificacao =
                            "Bom aproveitamento";

                    }

                    else if (
                        percentual >= 50
                    ) {

                        classificacao =
                            "Aproveitamento intermediário";

                    }

                    else {

                        classificacao =
                            "Baixo aproveitamento";

                    }

                }

            }


            let percentualTexto =
                "—";


            if (
                score !== null &&
                score !== undefined &&
                total > 0
            ) {

                percentualTexto =
                    Math.round(
                        (Number(score) /
                        Number(total)) *
                        100
                    ) + "%";

            }


            let data =
                "—";


            if (
                tentativa.finished_at
            ) {

                data =
                    new Date(
                        tentativa.finished_at
                    ).toLocaleString(
                        "pt-BR"
                    );
            }


            let classeBadge =
                "badge";


            if (
                classificacao ===
                "Negociador razoável"
            ) {

                classeBadge =
                    "badge badge-razoavel";

            }


            if (
                classificacao ===
                "Mau Negociador"
            ) {

                classeBadge =
                    "badge badge-mau";

            }


            linha.innerHTML = `

                <td>
                    ${escaparHTML(nome)}
                </td>

                <td>
                    ${total}
                </td>

                <td>
                    ${
                        score === null ||
                        score === undefined
                            ? "—"
                            : escaparHTML(
                                String(score)
                              )
                    }
                </td>

                <td>

                    <span
                        class="${classeBadge}"
                    >

                        ${escaparHTML(
                            classificacao
                        )}

                    </span>

                </td>

                <td>
                    ${percentualTexto}
                </td>

                <td>
                    ${escaparHTML(data)}
                </td>

                <td>

                    <span class="badge">
                        Concluído
                    </span>

                </td>

            `;


            tabela.appendChild(
                linha
            );

        }
    );
}


/* ============================================================
   LIMPAR PESQUISA
============================================================ */

function limparPesquisa() {

    document.getElementById(
        "pesquisaNome"
    ).value =
        "";

    filtrarResultados();
}


/* ============================================================
   ESCAPAR HTML
============================================================ */

function escaparHTML(
    texto
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        texto || "";

    return div.innerHTML;
}


/* ============================================================
   SAIR
============================================================ */

function sair() {

    accessTokenNumerico =
        null;

    accessTokenNegociacao =
        null;

    emailAdministrador =
        null;

    todosResultados =
        [];


    localStorage.removeItem(
        "painel_email"
    );

    localStorage.removeItem(
        "painel_numerico_token"
    );

    localStorage.removeItem(
        "painel_negociacao_token"
    );


    document.getElementById(
        "painel"
    ).style.display =
        "none";


    document.getElementById(
        "login"
    ).style.display =
        "block";


    document.getElementById(
        "email"
    ).value =
        "";

    document.getElementById(
        "senha"
    ).value =
        "";

    document.getElementById(
        "mensagemLogin"
    ).textContent =
        "";
}


/* ============================================================
   RECUPERAR SESSÃO
============================================================ */

const tokenNumericoSalvo =
    localStorage.getItem(
