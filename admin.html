<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Painel Administrativo</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.container {
    max-width: 1100px;
    width: 100%;
    margin: 40px auto;
    padding: 30px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
    flex: 1;
}

h1 {
    margin-top: 0;
}

#painel {
    display: none;
}

#login {
    max-width: 450px;
    margin: auto;
}

input,
select {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

label {
    font-weight: bold;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.botao-sair {
    background: #dc2626;
    float: right;
}

.botao-sair:hover {
    background: #b91c1c;
}

.botao-limpar {
    background: #6b7280;
}

.botao-limpar:hover {
    background: #4b5563;
}

.botao-atualizar {
    background: #2563eb;
}

.seletor-teste {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}

.seletor-teste label {
    display: block;
    margin-bottom: 8px;
}

.seletor-teste select {
    margin-bottom: 0;
}

.status-teste {
    padding: 13px 15px;
    background: #f3f4f6;
    border-radius: 8px;
    margin-bottom: 20px;
    color: #374151;
    font-weight: bold;
}

.pesquisa {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}

.pesquisa-titulo {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

.pesquisa-linha {
    display: flex;
    gap: 10px;
    align-items: center;
}

.pesquisa-linha input {
    margin: 0;
    flex: 1;
}

.contador {
    margin-top: 12px;
    color: #6b7280;
    font-size: 14px;
}

.tabela-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th,
td {
    padding: 13px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #f9fafb;
}

tr:hover {
    background: #f9fafb;
}

.vazio {
    text-align: center;
    padding: 40px;
    color: #6b7280;
}

.carregando {
    text-align: center;
    padding: 30px;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    background: #dcfce7;
    color: #166534;
}

.badge-razoavel {
    background: #fef3c7;
    color: #92400e;
}

.badge-mau {
    background: #fee2e2;
    color: #991b1b;
}

.erro {
    color: #dc2626;
    margin-top: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.usuario-logado {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 20px;
}

.assinatura {
    text-align: center;
    color: #9ca3af;
    font-size: 10px;
    font-weight: normal;
    margin-top: 25px;
    padding-bottom: 12px;
    letter-spacing: 0.2px;
}

@media (max-width: 700px) {

    .container {
        margin: 15px;
        padding: 20px;
        width: auto;
    }

    .pesquisa-linha {
        flex-direction: column;
        align-items: stretch;
    }

    .pesquisa-linha button {
        width: 100%;
    }

    table {
        font-size: 14px;
    }

}

</style>

</head>

<body>

<div class="container">


<!-- ==========================================================
     LOGIN
=========================================================== -->

<section id="login">

    <h1>Painel Administrativo</h1>

    <p>
        Acesse os resultados dos testes.
    </p>

    <label for="email">
        E-mail
    </label>

    <input
        type="email"
        id="email"
        placeholder="Seu e-mail"
        autocomplete="email"
    >

    <label for="senha">
        Senha
    </label>

    <input
        type="password"
        id="senha"
        placeholder="Sua senha"
        autocomplete="current-password"
    >

    <button
        onclick="entrar()"
        id="botaoEntrar"
    >
        Entrar
    </button>

    <div
        id="mensagemLogin"
        class="erro"
    ></div>

</section>


<!-- ==========================================================
     PAINEL
=========================================================== -->

<section id="painel">


    <div class="topo">

        <button
            class="botao-sair"
            onclick="sair()"
        >
            Sair
        </button>

        <h1>
            Painel Administrativo
        </h1>

        <div
            id="usuarioLogado"
            class="usuario-logado"
        ></div>

    </div>


    <!-- ======================================================
         SELEÇÃO DO TESTE
    ======================================================= -->

    <div class="seletor-teste">

        <label for="seletorTeste">
            Selecione o teste
        </label>

        <select
            id="seletorTeste"
            onchange="trocarTeste()"
        >

            <option value="numerico">
                Teste de Raciocínio Numérico
            </option>

            <option value="negociacao">
                Teste de Negociação
            </option>

        </select>

    </div>


    <div
        id="statusTeste"
        class="status-teste"
    >
        Teste de Raciocínio Numérico
    </div>


    <!-- ======================================================
         PESQUISA
    ======================================================= -->

    <div class="pesquisa">

        <label
            class="pesquisa-titulo"
            for="pesquisaNome"
        >
            Pesquisar candidato por nome
        </label>

        <div class="pesquisa-linha">

            <input
                type="text"
                id="pesquisaNome"
                placeholder="Digite o nome do candidato..."
                oninput="filtrarResultados()"
            >

            <button
                class="botao-limpar"
                onclick="limparPesquisa()"
            >
                Limpar
            </button>

            <button
                class="botao-atualizar"
                onclick="atualizarResultados()"
            >
                Atualizar
            </button>

        </div>

        <div
            id="contador"
            class="contador"
        >
            Carregando...
        </div>

    </div>


    <!-- ======================================================
         STATUS
    ======================================================= -->

    <div
        id="status"
        class="carregando"
    >
        Carregando resultados...
    </div>


    <!-- ======================================================
         TABELA
    ======================================================= -->

    <div class="tabela-container">

        <table>

            <thead id="cabecalhoTabela">
            </thead>

            <tbody id="resultados">
            </tbody>

        </table>

    </div>


</section>


<!-- ==========================================================
     ASSINATURA
=========================================================== -->

<div class="assinatura">

    Desenvolvido por :
    Wemerson Leal
    © 2026 -
    RH Garcia Supermercados.

</div>


</div>


<script>

/* ============================================================
   PROJETO ANTIGO
   TESTE DE RACIOCÍNIO NUMÉRICO
============================================================ */

const NUMERICO_URL =
    "https://rfzauftsgqidtzwtdjlp.supabase.co";

const NUMERICO_KEY =
    "sb_publishable_QAHvlE6BbMgm5nc9WzYJEQ_7f_YvkrU";


/* ============================================================
   PROJETO NOVO
   TESTE DE NEGOCIAÇÃO
============================================================ */

const NEGOCIACAO_URL =
    "https://wxlltutgwoslyhqvbhqb.supabase.co";

const NEGOCIACAO_KEY =
    "sb_publishable_xgSMPfvdpWLPjwECyOkADw_FR44UcVk";


/* ============================================================
   VARIÁVEIS
============================================================ */

let tokenNumerico = null;

let tokenNegociacao = null;

let emailAdministrador = null;

let testeAtual = "numerico";

let todosResultados = [];


/* ============================================================
   LOGIN
============================================================ */

async function entrar() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const senha =
        document
            .getElementById("senha")
            .value;

    const mensagem =
        document.getElementById(
            "mensagemLogin"
        );

    const botao =
        document.getElementById(
            "botaoEntrar"
        );


    mensagem.textContent = "";


    if (!email || !senha) {

        mensagem.textContent =
            "Informe seu e-mail e senha.";

        return;
    }


    botao.disabled = true;

    botao.textContent =
        "Entrando...";


    try {

        /*
         * Faz login no projeto antigo
         */

        const loginNumerico =
            await fazerLoginSupabase(
                NUMERICO_URL,
                NUMERICO_KEY,
                email,
                senha
            );


        /*
         * Faz login no projeto novo
         */

        const loginNegociacao =
            await fazerLoginSupabase(
                NEGOCIACAO_URL,
                NEGOCIACAO_KEY,
                email,
                senha
            );


        /*
         * Guarda os dois tokens
         */

        tokenNumerico =
            loginNumerico.access_token;

        tokenNegociacao =
            loginNegociacao.access_token;

        emailAdministrador =
            email;


        localStorage.setItem(
            "admin_token_numerico",
            tokenNumerico
        );

        localStorage.setItem(
            "admin_token_negociacao",
            tokenNegociacao
        );

        localStorage.setItem(
            "admin_email",
            email
        );


        mostrarPainel();


    } catch (erro) {

        console.error(
            "Erro no login:",
            erro
        );


        mensagem.textContent =
            erro.message;


        botao.disabled = false;

        botao.textContent =
            "Entrar";
    }
}


/* ============================================================
   FUNÇÃO DE LOGIN SUPABASE
============================================================ */

async function fazerLoginSupabase(
    url,
    key,
    email,
    senha
) {

    const resposta =
        await fetch(
            url +
            "/auth/v1/token?grant_type=password",
            {
                method: "POST",

                headers: {
                    "apikey": key,

                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        email: email,
                        password: senha
                    })
            }
        );


    const texto =
        await resposta.text();


    let dados = {};


    try {

        dados =
            texto
                ? JSON.parse(texto)
                : {};

    } catch {

        dados = {};
    }


    if (!resposta.ok) {

        throw new Error(

            dados.error_description ||
            dados.msg ||
            dados.message ||
            "Não foi possível entrar em um dos projetos Supabase."

        );
    }


    if (!dados.access_token) {

        throw new Error(
            "O Supabase não retornou o token de acesso."
        );
    }


    return dados;
}


/* ============================================================
   MOSTRAR PAINEL
============================================================ */

function mostrarPainel() {

    document.getElementById(
        "login"
    ).style.display =
        "none";


    document.getElementById(
        "painel"
    ).style.display =
        "block";


    document.getElementById(
        "usuarioLogado"
    ).textContent =
        emailAdministrador
            ? "Usuário conectado: " +
              emailAdministrador
            : "";


    atualizarInterfaceTeste();

    carregarResultados();
}


/* ============================================================
   TROCAR TESTE
============================================================ */

function trocarTeste() {

    testeAtual =
        document.getElementById(
            "seletorTeste"
        ).value;


    todosResultados = [];


    document.getElementById(
        "pesquisaNome"
    ).value = "";


    atualizarInterfaceTeste();

    carregarResultados();
}


/* ============================================================
   ATUALIZAR INTERFACE
============================================================ */

function atualizarInterfaceTeste() {

    const statusTeste =
        document.getElementById(
            "statusTeste"
        );


    const cabecalho =
        document.getElementById(
            "cabecalhoTabela"
        );


    if (
        testeAtual ===
        "numerico"
    ) {

        statusTeste.textContent =
            "Teste selecionado: Teste de Raciocínio Numérico";


        cabecalho.innerHTML = `

            <tr>

                <th>
                    Candidato
                </th>

                <th>
                    Questões
                </th>

                <th>
                    Pontuação
                </th>

                <th>
                    Aproveitamento
                </th>

                <th>
                    Data
                </th>

                <th>
                    Status
                </th>

            </tr>
        `;

    } else {

        statusTeste.textContent =
            "Teste selecionado: Teste de Negociação";


        cabecalho.innerHTML = `

            <tr>

                <th>
                    Candidato
                </th>

                <th>
                    Questões
                </th>

                <th>
                    Pontuação
                </th>

                <th>
                    Classificação
                </th>

                <th>
                    Data
                </th>

                <th>
                    Status
                </th>

            </tr>
        `;
    }
}


/* ============================================================
   CARREGAR RESULTADOS
============================================================ */

async function carregarResultados() {

    const status =
        document.getElementById(
            "status"
        );


    const contador =
        document.getElementById(
            "contador"
        );


    status.textContent =
        "Carregando resultados...";


    contador.textContent =
        "";


    try {

        let url;

        let token;

        let projeto;


        /*
         * RACIOCÍNIO NUMÉRICO
         */

        if (
            testeAtual ===
            "numerico"
        ) {

            token =
                tokenNumerico;

            projeto =
                NUMERICO_URL;


            /*
             * Estrutura conhecida:
             *
             * attempts
             * candidates
             */

            url =
                projeto +
                "/rest/v1/attempts" +
                "?select=id,candidate_id,total_questions,score,finished_at,created_at,candidates(name)" +
                "&order=created_at.desc";

        }


        /*
         * NEGOCIAÇÃO
         */

        else {

            token =
                tokenNegociacao;

            projeto =
                NEGOCIACAO_URL;


            url =
                projeto +
                "/rest/v1/attempts" +
                "?select=id,candidate_id,total_questions,score,classification,finished_at,created_at,candidates(name)" +
                "&order=created_at.desc";
        }


        if (!token) {

            throw new Error(
                "Sessão administrativa não encontrada."
            );
        }


        const resposta =
            await fetch(
                url,
                {
                    method: "GET",

                    headers: {

                        "apikey":
                            testeAtual ===
                            "numerico"
                                ? NUMERICO_KEY
                                : NEGOCIACAO_KEY,

                        "Authorization":
                            "Bearer " +
                            token,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const texto =
            await resposta.text();


        let dados;


        try {

            dados =
                texto
                    ? JSON.parse(texto)
                    : [];

        } catch {

            dados = [];
        }


        if (!resposta.ok) {

            throw new Error(

                dados.message ||
                dados.hint ||
                dados.details ||
                `HTTP ${resposta.status}`

            );
        }


        todosResultados =
            Array.isArray(dados)
                ? dados
                : [];


        status.textContent =
            "";


        filtrarResultados();


    } catch (erro) {

        console.error(
            "Erro ao carregar resultados:",
            erro
        );


        status.textContent =
            "Erro ao carregar resultados: " +
            erro.message;


        contador.textContent = "";
    }
}


/* ============================================================
   ATUALIZAR
============================================================ */

async function atualizarResultados() {

    await carregarResultados();
}


/* ============================================================
   FILTRAR
============================================================ */

function filtrarResultados() {

    const campo =
        document.getElementById(
            "pesquisaNome"
        );


    const texto =
        campo.value
            .trim()
            .toLowerCase();


    const resultadosFiltrados =
        todosResultados.filter(
            function(tentativa) {

                const nome =
                    tentativa.candidates &&
                    tentativa.candidates.name
                        ? tentativa.candidates.name
                        : "Sem nome";


                return nome
                    .toLowerCase()
                    .includes(texto);
            }
        );


    mostrarResultados(
        resultadosFiltrados
    );
}


/* ============================================================
   MOSTRAR RESULTADOS
============================================================ */

function mostrarResultados(
    dados
) {

    const tabela =
        document.getElementById(
            "resultados"
        );


    tabela.innerHTML = "";


    const contador =
        document.getElementById(
            "contador"
        );


    if (
        dados.length === 0
    ) {

        contador.textContent =
            "Nenhum candidato encontrado.";


        tabela.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="vazio"
                >

                    Nenhum candidato encontrado.

                </td>

            </tr>
        `;


        return;
    }


    contador.textContent =
        dados.length === 1
            ? "1 resultado encontrado."
            : dados.length +
              " resultados encontrados.";


    dados.forEach(
        function(tentativa) {

            const linha =
                document.createElement(
                    "tr"
                );


            const nome =
                tentativa.candidates &&
                tentativa.candidates.name
                    ? tentativa.candidates.name
                    : "Sem nome";


            const total =
                tentativa.total_questions ||
                0;


            const score =
                tentativa.score;


            let data =
                "—";


            const dataOriginal =
                tentativa.finished_at ||
                tentativa.created_at;


            if (dataOriginal) {

                data =
                    new Date(
                        dataOriginal
                    ).toLocaleString(
                        "pt-BR"
                    );
            }


            /*
             * TESTE DE NEGOCIAÇÃO
             */

            if (
                testeAtual ===
                "negociacao"
            ) {

                const classificacao =
                    tentativa.classification ||
                    "—";


                let classeBadge =
                    "badge";


                if (
                    classificacao ===
                    "Negociador razoável"
                ) {

                    classeBadge =
                        "badge badge-razoavel";
                }


                if (
                    classificacao ===
                    "Mau Negociador"
                ) {

                    classeBadge =
                        "badge badge-mau";
                }


                linha.innerHTML = `

                    <td>
                        ${escaparHTML(nome)}
                    </td>

                    <td>
                        ${total}
                    </td>

                    <td>
                        ${
                            score === null ||
                            score === undefined
                                ? "—"
                                : score
                        }
                    </td>

                    <td>

                        <span
                            class="${classeBadge}"
                        >

                            ${escaparHTML(
                                classificacao
                            )}

                        </span>

                    </td>

                    <td>
                        ${data}
                    </td>

                    <td>

                        <span class="badge">
                            Concluído
                        </span>

                    </td>
                `;

            }


            /*
             * TESTE DE RACIOCÍNIO NUMÉRICO
             */

            else {

                let percentual =
                    "—";


                /*
                 * Se total_questions for
                 * quantidade de questões,
                 * calcula o percentual.
                 */

                if (
                    score !== null &&
                    score !== undefined &&
                    total > 0
                ) {

                    percentual =
                        Math.round(
                            (
                                Number(score) /
                                Number(total)
                            ) *
                            100
                        ) + "%";
                }


                linha.innerHTML = `

                    <td>
                        ${escaparHTML(nome)}
                    </td>

                    <td>
                        ${total}
                    </td>

                    <td>
                        ${
                            score === null ||
                            score === undefined
                                ? "—"
                                : score
                        }
                    </td>

                    <td>
                        ${percentual}
                    </td>

                    <td>
                        ${data}
                    </td>

                    <td>

                        <span class="badge">
                            Concluído
                        </span>

                    </td>
                `;
            }


            tabela.appendChild(
                linha
            );
        }
    );
}


/* ============================================================
   LIMPAR PESQUISA
============================================================ */

function limparPesquisa() {

    document.getElementById(
        "pesquisaNome"
    ).value = "";


    filtrarResultados();
}


/* ============================================================
   ESCAPAR HTML
============================================================ */

function escaparHTML(
    texto
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto || "";


    return div.innerHTML;
}


/* ============================================================
   SAIR
============================================================ */

function sair() {

    tokenNumerico = null;

    tokenNegociacao = null;

    emailAdministrador = null;

    todosResultados = [];


    localStorage.removeItem(
        "admin_token_numerico"
    );

    localStorage.removeItem(
        "admin_token_negociacao"
    );

    localStorage.removeItem(
        "admin_email"
    );


    document.getElementById(
        "painel"
    ).style.display =
        "none";


    document.getElementById(
        "login"
    ).style.display =
        "block";


    document.getElementById(
        "email"
    ).value = "";


    document.getElementById(
        "senha"
    ).value = "";


    document.getElementById(
        "mensagemLogin"
    ).textContent = "";
}


/* ============================================================
   RECUPERAR SESSÃO
============================================================ */

const tokenNumericoSalvo =
    localStorage.getItem(
        "admin_token_numerico"
    );


const tokenNegociacaoSalvo =
    localStorage.getItem(
        "admin_token_negociacao"
    );


const emailSalvo =
    localStorage.getItem(
        "admin_email"
    );


if (
    tokenNumericoSalvo &&
    tokenNegociacaoSalvo
) {

    tokenNumerico =
        tokenNumericoSalvo;

    tokenNegociacao =
        tokenNegociacaoSalvo;

    emailAdministrador =
        emailSalvo;

    mostrarPainel();
}

</script>

</body>

</html>
