<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo - Testes</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    min-height: 100vh;
}

.container {
    max-width: 1100px;
    width: calc(100% - 30px);
    margin: 30px auto;
    padding: 30px;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
    color: #111827;
}

h2 {
    margin-top: 0;
    color: #111827;
}

#painel {
    display: none;
}

#login {
    max-width: 450px;
    margin: 50px auto;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    background: #2563eb;
    color: #ffffff;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.botao-sair {
    background: #dc2626;
    float: right;
}

.botao-sair:hover {
    background: #b91c1c;
}

.botao-teste {
    width: 100%;
    padding: 18px;
    background: #f9fafb;
    color: #374151;
    border: 2px solid #d1d5db;
    font-size: 16px;
    font-weight: bold;
}

.botao-teste:hover {
    background: #eff6ff;
    border-color: #2563eb;
}

.botao-teste.ativo {
    background: #2563eb;
    color: #ffffff;
    border-color: #2563eb;
}

.seletor-testes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 25px;
}

.usuario-logado {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 25px;
}

.pesquisa {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}

.pesquisa-titulo {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

.pesquisa-linha {
    display: flex;
    gap: 10px;
    align-items: center;
}

.pesquisa-linha input {
    margin: 0;
    flex: 1;
}

.botao-limpar {
    background: #6b7280;
}

.botao-limpar:hover {
    background: #4b5563;
}

.botao-atualizar {
    background: #2563eb;
}

.contador {
    margin-top: 12px;
    color: #6b7280;
    font-size: 14px;
}

.status {
    text-align: center;
    padding: 25px;
    color: #6b7280;
    white-space: pre-wrap;
}

.tabela-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th,
td {
    padding: 13px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #f9fafb;
}

tr:hover {
    background: #f9fafb;
}

.vazio {
    text-align: center;
    padding: 40px;
    color: #6b7280;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    background: #dcfce7;
    color: #166534;
}

.badge-razoavel {
    background: #fef3c7;
    color: #92400e;
}

.badge-mau {
    background: #fee2e2;
    color: #991b1b;
}

.erro {
    color: #dc2626;
    margin-top: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.assinatura {
    text-align: center;
    color: #9ca3af;
    font-size: 10px;
    margin-top: 30px;
    padding-bottom: 10px;
}

@media (max-width: 700px) {

    .container {
        margin: 15px;
        padding: 20px;
    }

    .seletor-testes {
        grid-template-columns: 1fr;
    }

    .pesquisa-linha {
        flex-direction: column;
        align-items: stretch;
    }

    .pesquisa-linha button {
        width: 100%;
    }

    table {
        font-size: 14px;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- =========================================================
     LOGIN
========================================================= -->

<section id="login">

    <h1>Painel Administrativo</h1>

    <p>
        Acesse para consultar os resultados dos testes.
    </p>

    <label for="email">
        E-mail
    </label>

    <input
        type="email"
        id="email"
        placeholder="Seu e-mail"
        autocomplete="email"
    >

    <label for="senha">
        Senha
    </label>

    <input
        type="password"
        id="senha"
        placeholder="Sua senha"
        autocomplete="current-password"
    >

    <button
        id="botaoEntrar"
        onclick="entrar()"
    >
        Entrar
    </button>

    <div
        id="mensagemLogin"
        class="erro"
    ></div>

</section>


<!-- =========================================================
     PAINEL
========================================================= -->

<section id="painel">

    <div style="overflow:hidden; margin-bottom:20px;">

        <button
            class="botao-sair"
            onclick="sair()"
        >
            Sair
        </button>

        <h1>
            Painel Administrativo
        </h1>

        <div
            id="usuarioLogado"
            class="usuario-logado"
        ></div>

    </div>


    <!-- =====================================================
         SELEÇÃO DOS TESTES
    ====================================================== -->

    <div class="seletor-testes">

        <button
            id="botaoNumerico"
            class="botao-teste"
            onclick="selecionarTeste('numerico')"
        >
            Teste de Raciocínio Numérico
        </button>

        <button
            id="botaoNegociacao"
            class="botao-teste"
            onclick="selecionarTeste('negociacao')"
        >
            Teste de Negociação
        </button>

    </div>


    <h2 id="tituloTeste">
        Selecione um teste
    </h2>


    <!-- =====================================================
         PESQUISA
    ====================================================== -->

    <div class="pesquisa">

        <label
            class="pesquisa-titulo"
            for="pesquisaNome"
        >
            Pesquisar candidato por nome
        </label>

        <div class="pesquisa-linha">

            <input
                type="text"
                id="pesquisaNome"
                placeholder="Digite o nome do candidato..."
                oninput="filtrarResultados()"
            >

            <button
                class="botao-limpar"
                onclick="limparPesquisa()"
            >
                Limpar
            </button>

            <button
                class="botao-atualizar"
                onclick="atualizarResultados()"
            >
                Atualizar
            </button>

        </div>

        <div
            id="contador"
            class="contador"
        >
            Selecione um teste.
        </div>

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div
        id="status"
        class="status"
    >
        Selecione um dos testes acima.
    </div>


    <!-- =====================================================
         TABELA
    ====================================================== -->

    <div class="tabela-container">

        <table>

            <thead id="cabecalhoTabela">
            </thead>

            <tbody id="resultados">
            </tbody>

        </table>

    </div>

</section>


<div class="assinatura">
    Desenvolvido por : Wemerson Leal © 2026 - RH Garcia Supermercados.
</div>

</div>


<script>

/* ==========================================================
   CONFIGURAÇÃO DO SUPABASE - RACIOCÍNIO NUMÉRICO
========================================================== */

const NUMERICO_URL =
    "https://rfzauftsgqidtzwtdjlp.supabase.co";

const NUMERICO_KEY =
    "sb_publishable_QAHvlE6BbMgm5nc9WzYJEQ_7f_YvkrU";


/* ==========================================================
   CONFIGURAÇÃO DO SUPABASE - NEGOCIAÇÃO
========================================================== */

const NEGOCIACAO_URL =
    "https://wasgpxeorsmhrryrnoih.supabase.co";

const NEGOCIACAO_KEY =
    "sb_publishable_9rZ70PM0VmmkQSUfd2AiPw_tJf2XU9_";


/* ==========================================================
   VARIÁVEIS
========================================================== */

let tokenNumerico = null;

let tokenNegociacao = null;

let emailLogado = null;

let testeSelecionado = null;

let todosResultados = [];


/* ==========================================================
   LOGIN NOS DOIS PROJETOS
========================================================== */

async function entrar() {

    const email =
        document.getElementById("email")
        .value
        .trim();

    const senha =
        document.getElementById("senha")
        .value;

    const mensagem =
        document.getElementById("mensagemLogin");

    const botao =
        document.getElementById("botaoEntrar");


    mensagem.textContent = "";


    if (!email || !senha) {

        mensagem.textContent =
            "Informe seu e-mail e senha.";

        return;
    }


    botao.disabled = true;

    botao.textContent =
        "Entrando...";


    try {

        /* ==================================================
           LOGIN NO PROJETO NUMÉRICO
        ================================================== */

        const respostaNumerico =
            await fetch(
                NUMERICO_URL +
                "/auth/v1/token?grant_type=password",
                {
                    method: "POST",

                    headers: {
                        "apikey": NUMERICO_KEY,
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: senha
                    })
                }
            );


        const textoNumerico =
            await respostaNumerico.text();


        let dadosNumerico = {};


        try {

            dadosNumerico =
                textoNumerico
                    ? JSON.parse(textoNumerico)
                    : {};

        } catch {

            dadosNumerico = {};

        }


        if (!respostaNumerico.ok) {

            throw new Error(
                "Login no projeto de Raciocínio Numérico:\n" +
                (
                    dadosNumerico.error_description ||
                    dadosNumerico.msg ||
                    dadosNumerico.message ||
                    "E-mail ou senha incorretos."
                )
            );
        }


        tokenNumerico =
            dadosNumerico.access_token;


        if (!tokenNumerico) {

            throw new Error(
                "O projeto de Raciocínio Numérico não retornou o token de acesso."
            );
        }


        /* ==================================================
           LOGIN NO PROJETO DE NEGOCIAÇÃO
        ================================================== */

        const respostaNegociacao =
            await fetch(
                NEGOCIACAO_URL +
                "/auth/v1/token?grant_type=password",
                {
                    method: "POST",

                    headers: {
                        "apikey": NEGOCIACAO_KEY,
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: senha
                    })
                }
            );


        const textoNegociacao =
            await respostaNegociacao.text();


        let dadosNegociacao = {};


        try {

            dadosNegociacao =
                textoNegociacao
                    ? JSON.parse(textoNegociacao)
                    : {};

        } catch {

            dadosNegociacao = {};

        }


        if (!respostaNegociacao.ok) {

            throw new Error(
                "Login no projeto de Negociação:\n" +
                (
                    dadosNegociacao.error_description ||
                    dadosNegociacao.msg ||
                    dadosNegociacao.message ||
                    "E-mail ou senha incorretos."
                )
            );
        }


        tokenNegociacao =
            dadosNegociacao.access_token;


        if (!tokenNegociacao) {

            throw new Error(
                "O projeto de Negociação não retornou o token de acesso."
            );
        }


        /* ==================================================
           SALVA SESSÃO
        ================================================== */

        emailLogado = email;


        localStorage.setItem(
            "painel_email",
            email
        );


        localStorage.setItem(
            "painel_token_numerico",
            tokenNumerico
        );


        localStorage.setItem(
            "painel_token_negociacao",
            tokenNegociacao
        );


        /* ==================================================
           ABRE PAINEL
        ================================================== */

        document.getElementById("login")
            .style.display = "none";


        document.getElementById("painel")
            .style.display = "block";


        document.getElementById("usuarioLogado")
            .textContent =
                "Usuário conectado: " +
                email;


        selecionarTeste("numerico");

    }

    catch (erro) {

        console.error(
            "Erro no login:",
            erro
        );


        mensagem.textContent =
            "Não foi possível fazer login.\n\n" +
            erro.message;


        botao.disabled = false;

        botao.textContent =
            "Entrar";
    }
}


/* ==========================================================
   SELECIONAR TESTE
========================================================== */

function selecionarTeste(tipo) {

    testeSelecionado = tipo;

    todosResultados = [];


    document.getElementById(
        "pesquisaNome"
    ).value = "";


    document.getElementById(
        "botaoNumerico"
    ).classList.remove("ativo");


    document.getElementById(
        "botaoNegociacao"
    ).classList.remove("ativo");


    if (tipo === "numerico") {

        document.getElementById(
            "botaoNumerico"
        ).classList.add("ativo");


        document.getElementById(
            "tituloTeste"
        ).textContent =
            "Teste de Raciocínio Numérico";


        montarCabecalhoNumerico();

    }

    else {

        document.getElementById(
            "botaoNegociacao"
        ).classList.add("ativo");


        document.getElementById(
            "tituloTeste"
        ).textContent =
            "Teste de Negociação";


        montarCabecalhoNegociacao();
    }


    carregarResultados();
}


/* ==========================================================
   CABEÇALHO NUMÉRICO
========================================================== */

function montarCabecalhoNumerico() {

    document.getElementById(
        "cabecalhoTabela"
    ).innerHTML = `

        <tr>

            <th>
                Candidato
            </th>

            <th>
                Questões
            </th>

            <th>
                Pontuação
            </th>

            <th>
                Taxa de aproveitamento
            </th>

            <th>
                Status
            </th>

        </tr>

    `;
}


/* ==========================================================
   CABEÇALHO NEGOCIAÇÃO
========================================================== */

function montarCabecalhoNegociacao() {

    document.getElementById(
        "cabecalhoTabela"
    ).innerHTML = `

        <tr>

            <th>
                Candidato
            </th>

            <th>
                Questões
            </th>

            <th>
                Pontuação
            </th>

            <th>
                Classificação
            </th>

            <th>
                Status
            </th>

        </tr>

    `;
}


/* ==========================================================
   CARREGAR RESULTADOS
========================================================== */

async function carregarResultados() {

    const status =
        document.getElementById("status");

    const contador =
        document.getElementById("contador");


    if (!testeSelecionado) {

        status.textContent =
            "Selecione um teste.";

        return;
    }


    status.textContent =
        "Carregando resultados...";


    contador.textContent =
        "Carregando...";


    try {

        let urlAttempts;

        let urlCandidates;

        let apiKey;

        let token;


        /* ==================================================
           RACIOCÍNIO NUMÉRICO
        ================================================== */

        if (
            testeSelecionado === "numerico"
        ) {

            urlAttempts =
                NUMERICO_URL +
                "/rest/v1/attempts" +
                "?select=id,candidate_id,score,total_questions";

            urlCandidates =
                NUMERICO_URL +
                "/rest/v1/candidates" +
                "?select=id,name";

            apiKey =
                NUMERICO_KEY;

            token =
                tokenNumerico;
        }


        /* ==================================================
           NEGOCIAÇÃO
        ================================================== */

        else {

            urlAttempts =
                NEGOCIACAO_URL +
                "/rest/v1/attempts" +
                "?select=id,candidate_id,score,total_questions,classification";

            urlCandidates =
                NEGOCIACAO_URL +
                "/rest/v1/candidates" +
                "?select=id,name";

            apiKey =
                NEGOCIACAO_KEY;

            token =
                tokenNegociacao;
        }


        if (!token) {

            throw new Error(
                "Token do teste selecionado não encontrado."
            );
        }


        /* ==================================================
           BUSCAR ATTEMPTS
        ================================================== */

        const respostaAttempts =
            await fetch(
                urlAttempts,
                {
                    method: "GET",

                    headers: {

                        "apikey":
                            apiKey,

                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const textoAttempts =
            await respostaAttempts.text();


        let attempts = [];


        try {

            attempts =
                textoAttempts
                    ? JSON.parse(textoAttempts)
                    : [];

        } catch {

            attempts = [];
        }


        if (!respostaAttempts.ok) {

            throw new Error(
                attempts.message ||
                attempts.hint ||
                attempts.details ||
                "Erro ao consultar attempts."
            );
        }


        /* ==================================================
           BUSCAR CANDIDATOS
        ================================================== */

        const respostaCandidates =
            await fetch(
                urlCandidates,
                {
                    method: "GET",

                    headers: {

                        "apikey":
                            apiKey,

                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const textoCandidates =
            await respostaCandidates.text();


        let candidates = [];


        try {

            candidates =
                textoCandidates
                    ? JSON.parse(textoCandidates)
                    : [];

        } catch {

            candidates = [];
        }


        if (!respostaCandidates.ok) {

            throw new Error(
                candidates.message ||
                candidates.hint ||
                candidates.details ||
                "Erro ao consultar candidates."
            );
        }


        /* ==================================================
           MAPEAR CANDIDATOS
        ================================================== */

        const mapaCandidatos = {};


        candidates.forEach(
            function(candidato) {

                mapaCandidatos[
                    candidato.id
                ] =
                    candidato.name ||
                    "Sem nome";

            }
        );


        /* ==================================================
           JUNTAR DADOS
        ================================================== */

        todosResultados =
            attempts.map(
                function(attempt) {

                    return {

                        id:
                            attempt.id,

                        candidate_id:
                            attempt.candidate_id,

                        candidate_name:
                            mapaCandidatos[
                                attempt.candidate_id
                            ] ||
                            "Sem nome",

                        score:
                            attempt.score,

                        total_questions:
                            attempt.total_questions,

                        classification:
                            attempt.classification

                    };

                }
            );


        status.textContent = "";


        filtrarResultados();

    }

    catch (erro) {

        console.error(
            "Erro ao carregar resultados:",
            erro
        );


        status.textContent =
            "Erro ao carregar resultados:\n\n" +
            erro.message;


        contador.textContent = "";
    }
}


/* ==========================================================
   FILTRAR RESULTADOS
========================================================== */

function filtrarResultados() {

    const campo =
        document.getElementById(
            "pesquisaNome"
        );


    const texto =
        campo.value
            .trim()
            .toLowerCase();


    const filtrados =
        todosResultados.filter(
            function(resultado) {

                return (
                    resultado.candidate_name ||
                    ""
                )
                .toLowerCase()
                .includes(texto);

            }
        );


    mostrarResultados(filtrados);
}


/* ==========================================================
   MOSTRAR RESULTADOS
========================================================== */

function mostrarResultados(dados) {

    const tabela =
        document.getElementById(
            "resultados"
        );


    const contador =
        document.getElementById(
            "contador"
        );


    tabela.innerHTML = "";


    if (dados.length === 0) {

        contador.textContent =
            "Nenhum candidato encontrado.";


        tabela.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="vazio"
                >

                    Nenhum resultado encontrado.

                </td>

            </tr>

        `;

        return;
    }


    contador.textContent =
        dados.length === 1
            ? "1 resultado encontrado."
            : dados.length +
              " resultados encontrados.";


    dados.forEach(
        function(resultado) {

            const linha =
                document.createElement("tr");


            const nome =
                resultado.candidate_name ||
                "Sem nome";


            const total =
                Number(
                    resultado.total_questions
                ) || 0;


            const score =
                Number(
                    resultado.score
                ) || 0;


            /* ==================================================
               RACIOCÍNIO NUMÉRICO
            ================================================== */

            if (
                testeSelecionado === "numerico"
            ) {

                let aproveitamento =
                    "—";


                if (total > 0) {

                    aproveitamento =
                        Math.round(
                            (
                                score /
                                total
                            ) * 100
                        ) + "%";

                }


                linha.innerHTML = `

                    <td>
                        ${escaparHTML(nome)}
                    </td>

                    <td>
                        ${total}
                    </td>

                    <td>
                        ${score}
                    </td>

                    <td>
                        <strong>
                            ${aproveitamento}
                        </strong>
                    </td>

                    <td>
                        <span class="badge">
                            Concluído
                        </span>
                    </td>

                `;

            }


            /* ==================================================
               NEGOCIAÇÃO
            ================================================== */

            else {

                const classificacao =
                    resultado.classification ||
                    "—";


                let classe =
                    "badge";


                if (
                    classificacao ===
                    "Negociador razoável"
                ) {

                    classe =
                        "badge badge-razoavel";
                }


                if (
                    classificacao ===
                    "Mau Negociador"
                ) {

                    classe =
                        "badge badge-mau";
                }


                linha.innerHTML = `

                    <td>
                        ${escaparHTML(nome)}
                    </td>

                    <td>
                        ${total}
                    </td>

                    <td>
                        ${score}
                    </td>

                    <td>

                        <span
                            class="${classe}"
                        >

                            ${escaparHTML(
                                classificacao
                            )}

                        </span>

                    </td>

                    <td>

                        <span class="badge">
                            Concluído
                        </span>

                    </td>

                `;

            }


            tabela.appendChild(linha);

        }
    );
}


/* ==========================================================
   ATUALIZAR
========================================================== */

async function atualizarResultados() {

    await carregarResultados();
}


/* ==========================================================
   LIMPAR PESQUISA
========================================================== */

function limparPesquisa() {

    document.getElementById(
        "pesquisaNome"
    ).value = "";


    filtrarResultados();
}


/* ==========================================================
   ESCAPAR HTML
========================================================== */

function escaparHTML(texto) {

    const div =
        document.createElement("div");


    div.textContent =
        texto || "";


    return div.innerHTML;
}


/* ==========================================================
   SAIR
========================================================== */

function sair() {

    tokenNumerico = null;

    tokenNegociacao = null;

    emailLogado = null;

    testeSelecionado = null;

    todosResultados = [];


    localStorage.removeItem(
        "painel_token_numerico"
    );


    localStorage.removeItem(
        "painel_token_negociacao"
    );


    localStorage.removeItem(
        "painel_email"
    );


    document.getElementById(
        "painel"
    ).style.display = "none";


    document.getElementById(
        "login"
    ).style.display = "block";


    document.getElementById(
        "email"
    ).value = "";


    document.getElementById(
        "senha"
    ).value = "";


    document.getElementById(
        "mensagemLogin"
    ).textContent = "";


    document.getElementById(
        "status"
    ).textContent =
        "Selecione um dos testes acima.";


    document.getElementById(
        "contador"
    ).textContent =
        "Selecione um teste.";
}


/* ==========================================================
   RECUPERAR SESSÃO
========================================================== */

const tokenNumericoSalvo =
    localStorage.getItem(
        "painel_token_numerico"
    );


const tokenNegociacaoSalvo =
    localStorage.getItem(
        "painel_token_negociacao"
    );


const emailSalvo =
    localStorage.getItem(
        "painel_email"
    );


/*
 * Só recupera a sessão automaticamente se
 * os DOIS tokens existirem.
 */

if (
    tokenNumericoSalvo &&
    tokenNegociacaoSalvo
) {

    tokenNumerico =
        tokenNumericoSalvo;


    tokenNegociacao =
        tokenNegociacaoSalvo;


    emailLogado =
        emailSalvo;


    document.getElementById(
        "login"
    ).style.display = "none";


    document.getElementById(
        "painel"
    ).style.display = "block";


    document.getElementById(
        "usuarioLogado"
    ).textContent =
        emailLogado
            ? "Usuário conectado: " +
              emailLogado
            : "";


    selecionarTeste("numerico");
}

</script>
