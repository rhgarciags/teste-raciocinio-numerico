<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel Administrativo</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    #painel {
      display: none;
    }

    #login {
      max-width: 450px;
      margin: auto;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      margin-bottom: 18px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    label {
      font-weight: bold;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .botao-sair {
      background: #dc2626;
      float: right;
    }

    .botao-sair:hover {
      background: #b91c1c;
    }

    .botao-limpar {
      background: #6b7280;
      margin-top: 7px;
    }

    .botao-limpar:hover {
      background: #4b5563;
    }

    .erro {
      color: #dc2626;
      margin-top: 15px;
    }

    .sucesso {
      color: #15803d;
      margin-top: 15px;
    }

    .topo {
      overflow: hidden;
      margin-bottom: 25px;
    }

    .pesquisa {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .pesquisa-titulo {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .pesquisa-linha {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .pesquisa-linha input {
      margin: 0;
      flex: 1;
    }

    .contador {
      margin-top: 12px;
      color: #6b7280;
      font-size: 14px;
    }

    .tabela-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      padding: 13px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f9fafb;
    }

    tr:hover {
      background: #f9fafb;
    }

    .vazio {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    .carregando {
      text-align: center;
      padding: 30px;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      background: #dcfce7;
      color: #166534;
    }

    @media (max-width: 600px) {

      .container {
        margin: 15px;
        padding: 20px;
      }

      .pesquisa-linha {
        flex-direction: column;
        align-items: stretch;
      }

      .botao-limpar {
        width: 100%;
      }

    }

  </style>

</head>


<body>

<div class="container">


  <!-- ================================
       LOGIN
       ================================= -->

  <section id="login">

    <h1>Painel Administrativo</h1>

    <p>
      Entre com seu e-mail e senha.
    </p>

    <label for="email">
      E-mail
    </label>

    <input
      type="email"
      id="email"
      placeholder="Seu e-mail"
      autocomplete="email"
    >


    <label for="senha">
      Senha
    </label>

    <input
      type="password"
      id="senha"
      placeholder="Sua senha"
      autocomplete="current-password"
    >


    <button
      onclick="entrar()"
      id="botaoEntrar"
    >
      Entrar
    </button>


    <div
      id="mensagemLogin"
      class="erro"
    ></div>

  </section>


  <!-- ================================
       PAINEL
       ================================= -->

  <section id="painel">

    <div class="topo">

      <button
        class="botao-sair"
        onclick="sair()"
      >
        Sair
      </button>

      <h1>
        Resultados dos candidatos
      </h1>

      <p>
        Consulte os resultados registrados no teste.
      </p>

    </div>


    <!-- ================================
         PESQUISA
         ================================= -->

    <div class="pesquisa">

      <label
        class="pesquisa-titulo"
        for="pesquisaNome"
      >
        Pesquisar candidato por nome
      </label>

      <div class="pesquisa-linha">

        <input
          type="text"
          id="pesquisaNome"
          placeholder="Digite o nome do candidato..."
          oninput="filtrarResultados()"
        >

        <button
          class="botao-limpar"
          onclick="limparPesquisa()"
        >
          Limpar
        </button>

      </div>

      <div
        id="contador"
        class="contador"
      >
        Carregando...
      </div>

    </div>


    <div
      id="status"
      class="carregando"
    >
      Carregando resultados...
    </div>


    <div class="tabela-container">

      <table id="tabela">

        <thead>

          <tr>

            <th>
              Candidato
            </th>

            <th>
              Questões
            </th>

            <th>
              Acertos
            </th>

            <th>
              Aproveitamento
            </th>

            <th>
              Data
            </th>

            <th>
              Status
            </th>

          </tr>

        </thead>

        <tbody id="resultados">
        </tbody>

      </table>

    </div>

  </section>

</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://rfzauftsgqidtzwtdjlp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_QAHvlE6BbMgm5nc9WzYJEQ_7f_YvkrU";


/* =====================================================
   VARIÁVEIS
   ===================================================== */

let todosResultados = [];


/* =====================================================
   ENTRAR
   ===================================================== */

async function entrar() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const senha =
    document
      .getElementById("senha")
      .value;


  const mensagem =
    document.getElementById(
      "mensagemLogin"
    );


  if (!email || !senha) {

    mensagem.textContent =
      "Informe seu e-mail e senha.";

    return;

  }


  const botao =
    document.getElementById(
      "botaoEntrar"
    );


  botao.disabled = true;

  mensagem.textContent =
    "Entrando...";


  try {

    const resposta =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",

          headers: {
            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            email: email,

            password: senha

          })
        }
      );


    const dados =
      await resposta.json();


    if (!resposta.ok) {

      throw new Error(
        dados.error_description ||
        dados.msg ||
        "E-mail ou senha incorretos."
      );

    }


    localStorage.setItem(
      "supabase_access_token",
      dados.access_token
    );


    localStorage.setItem(
      "supabase_refresh_token",
      dados.refresh_token
    );


    mostrarPainel(
      dados.access_token
    );


  } catch (erro) {

    console.error(erro);

    mensagem.textContent =
      erro.message;

    botao.disabled = false;

  }

}


/* =====================================================
   MOSTRAR PAINEL
   ===================================================== */

async function mostrarPainel(
  token
) {

  document.getElementById(
    "login"
  ).style.display =
    "none";


  document.getElementById(
    "painel"
  ).style.display =
    "block";


  await carregarResultados(
    token
  );

}


/* =====================================================
   CARREGAR RESULTADOS
   ===================================================== */

async function carregarResultados(
  token
) {

  const status =
    document.getElementById(
      "status"
    );


  try {

    const resposta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/attempts" +
        "?select=id,candidate_id,total_questions,score,finished_at,candidates(name)" +
        "&order=id.desc",
        {
          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + token

          }
        }
      );


    const dados =
      await resposta.json();


    if (!resposta.ok) {

      throw new Error(
        dados.message ||
        dados.hint ||
        "Não foi possível carregar os resultados."
      );

    }


    /*
     * Guardamos todos os resultados
     * para podermos filtrar localmente.
     */

    todosResultados =
      Array.isArray(dados)
        ? dados
        : [];


    status.textContent =
      "";


    filtrarResultados();


  } catch (erro) {

    console.error(erro);

    status.textContent =
      "Erro ao carregar resultados: " +
      erro.message;

    document.getElementById(
      "contador"
    ).textContent =
      "";

  }

}


/* =====================================================
   FILTRAR POR NOME
   ===================================================== */

function filtrarResultados() {

  const campo =
    document.getElementById(
      "pesquisaNome"
    );


  const texto =
    campo.value
      .trim()
      .toLowerCase();


  const resultadosFiltrados =
    todosResultados.filter(
      function(tentativa) {

        const nome =
          tentativa.candidates &&
          tentativa.candidates.name
            ? tentativa.candidates.name
            : "Sem nome";


        return nome
          .toLowerCase()
          .includes(texto);

      }
    );


  mostrarResultados(
    resultadosFiltrados
  );

}


/* =====================================================
   MOSTRAR RESULTADOS NA TABELA
   ===================================================== */

function mostrarResultados(
  dados
) {

  const tabela =
    document.getElementById(
      "resultados"
    );


  tabela.innerHTML =
    "";


  const contador =
    document.getElementById(
      "contador"
    );


  if (
    dados.length === 0
  ) {

    contador.textContent =
      "Nenhum candidato encontrado.";

    tabela.innerHTML =
      `
      <tr>
        <td
          colspan="6"
          class="vazio"
        >
          Nenhum candidato encontrado.
        </td>
      </tr>
      `;

    return;

  }


  contador.textContent =
    dados.length === 1
      ? "1 resultado encontrado."
      : dados.length +
        " resultados encontrados.";


  dados.forEach(
    function(tentativa) {

      const linha =
        document.createElement(
          "tr"
        );


      const nome =
        tentativa.candidates
          ? tentativa.candidates.name
          : "Sem nome";


      const total =
        tentativa.total_questions || 0;


      const score =
        tentativa.score;


      let percentual =
        "—";


      if (
        score !== null &&
        score !== undefined &&
        total > 0
      ) {

        percentual =
          Math.round(
            (score / total) *
            100
          ) + "%";

      }


      let data =
        "—";


      if (
        tentativa.finished_at
      ) {

        data =
          new Date(
            tentativa.finished_at
          ).toLocaleString(
            "pt-BR"
          );

      }


      let statusTexto =
        "Em andamento";


      if (
        tentativa.finished_at
      ) {

        statusTexto =
          "Concluído";

      }


      linha.innerHTML =
        `
        <td>
          ${escaparHTML(nome)}
        </td>

        <td>
          ${total}
        </td>

        <td>
          ${
            score === null ||
            score === undefined
              ? "—"
              : score
          }
        </td>

        <td>
          ${percentual}
        </td>

        <td>
          ${data}
        </td>

        <td>
          <span class="badge">
            ${statusTexto}
          </span>
        </td>
        `;


      tabela.appendChild(
        linha
      );

    }
  );

}


/* =====================================================
   LIMPAR PESQUISA
   ===================================================== */

function limparPesquisa() {

  document.getElementById(
    "pesquisaNome"
  ).value =
    "";


  filtrarResultados();

}


/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function escaparHTML(
  texto
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    texto || "";

  return div.innerHTML;

}


/* =====================================================
   SAIR
   ===================================================== */

function sair() {

  localStorage.removeItem(
    "supabase_access_token"
  );

  localStorage.removeItem(
    "supabase_refresh_token"
  );


  todosResultados =
    [];


  document.getElementById(
    "painel"
  ).style.display =
    "none";


  document.getElementById(
    "login"
  ).style.display =
    "block";


  document.getElementById(
    "email"
  ).value =
    "";


  document.getElementById(
    "senha"
  ).value =
    "";


  document.getElementById(
    "pesquisaNome"
  ).value =
    "";

}


/* =====================================================
   VERIFICAR LOGIN EXISTENTE
   ===================================================== */

const tokenSalvo =
  localStorage.getItem(
    "supabase_access_token"
  );


if (tokenSalvo) {

  mostrarPainel(
    tokenSalvo
  );

}

</script>

</body>

</html>
