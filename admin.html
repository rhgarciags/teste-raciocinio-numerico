<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Painel Administrativo - Testes</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f3f4f6;

    color: #1f2937;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

}


.container {

    max-width: 1100px;

    width: 100%;

    margin: 40px auto;

    padding: 30px;

    background: white;

    border-radius: 14px;

    box-shadow:
        0 5px 25px rgba(0,0,0,.08);

    flex: 1;

}


h1 {

    margin-top: 0;

    color: #111827;

}


#painel {

    display: none;

}


#login {

    max-width: 450px;

    margin: auto;

}


input,
select {

    width: 100%;

    padding: 13px;

    margin-top: 7px;

    margin-bottom: 18px;

    border:
        1px solid #d1d5db;

    border-radius: 8px;

    font-size: 16px;

    background: white;

}


label {

    font-weight: bold;

}


button {

    border: none;

    border-radius: 8px;

    padding: 12px 20px;

    background: #2563eb;

    color: white;

    font-size: 15px;

    cursor: pointer;

}


button:hover {

    background: #1d4ed8;

}


button:disabled {

    background: #9ca3af;

    cursor: not-allowed;

}


.botao-sair {

    background: #dc2626;

    float: right;

}


.botao-sair:hover {

    background: #b91c1c;

}


.botao-limpar {

    background: #6b7280;

}


.botao-limpar:hover {

    background: #4b5563;

}


.botao-atualizar {

    background: #2563eb;

}


.erro {

    color: #dc2626;

    margin-top: 15px;

    line-height: 1.5;

    white-space: pre-wrap;

}


.sucesso {

    color: #15803d;

    margin-top: 15px;

}


.topo {

    overflow: hidden;

    margin-bottom: 25px;

}


.usuario-logado {

    color: #6b7280;

    font-size: 14px;

    margin-bottom: 20px;

}


.seletor-teste {

    background: #eff6ff;

    border:
        1px solid #bfdbfe;

    border-radius: 10px;

    padding: 20px;

    margin-bottom: 25px;

}


.seletor-titulo {

    display: block;

    color: #1e3a8a;

    font-weight: bold;

    margin-bottom: 8px;

}


.seletor-teste select {

    margin: 0;

    border-color: #93c5fd;

    font-weight: bold;

    color: #1e3a8a;

}


.pesquisa {

    background: #f9fafb;

    border:
        1px solid #e5e7eb;

    border-radius: 10px;

    padding: 20px;

    margin-bottom: 20px;

}


.pesquisa-titulo {

    display: block;

    margin-bottom: 8px;

    font-weight: bold;

}


.pesquisa-linha {

    display: flex;

    gap: 10px;

    align-items: center;

}


.pesquisa-linha input {

    margin: 0;

    flex: 1;

}


.pesquisa-linha button {

    white-space: nowrap;

}


.contador {

    margin-top: 12px;

    color: #6b7280;

    font-size: 14px;

}


.tabela-container {

    overflow-x: auto;

}


table {

    width: 100%;

    border-collapse: collapse;

    margin-top: 20px;

}


th,
td {

    padding: 13px;

    border-bottom:
        1px solid #e5e7eb;

    text-align: left;

    white-space: nowrap;

}


th {

    background: #f9fafb;

}


tr:hover {

    background: #f9fafb;

}


.vazio {

    text-align: center;

    padding: 40px;

    color: #6b7280;

}


.carregando {

    text-align: center;

    padding: 30px;

    color: #6b7280;

}


.badge {

    display: inline-block;

    padding: 5px 9px;

    border-radius: 999px;

    font-size: 12px;

    font-weight: bold;

    background: #dcfce7;

    color: #166534;

}


.badge-razoavel {

    background: #fef3c7;

    color: #92400e;

}


.badge-mau {

    background: #fee2e2;

    color: #991b1b;

}


.badge-info {

    background: #dbeafe;

    color: #1e40af;

}


.assinatura {

    text-align: center;

    color: #9ca3af;

    font-size: 10px;

    font-weight: normal;

    margin-top: 25px;

    padding-bottom: 12px;

    letter-spacing: 0.2px;

}


@media (max-width: 700px) {

    .container {

        margin: 15px;

        padding: 20px;

        width: auto;

    }


    .pesquisa-linha {

        flex-direction: column;

        align-items: stretch;

    }


    .pesquisa-linha button {

        width: 100%;

    }


    .botao-sair {

        float: none;

        width: 100%;

        margin-bottom: 20px;

    }


    table {

        font-size: 14px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ==========================================================
     LOGIN
=========================================================== -->

<section id="login">

    <h1>
        Painel Administrativo
    </h1>

    <p>
        Acesse os resultados dos testes.
    </p>


    <label for="email">
        E-mail
    </label>

    <input
        type="email"
        id="email"
        placeholder="Seu e-mail"
        autocomplete="email"
    >


    <label for="senha">
        Senha
    </label>

    <input
        type="password"
        id="senha"
        placeholder="Sua senha"
        autocomplete="current-password"
    >


    <button
        onclick="entrar()"
        id="botaoEntrar"
    >
        Entrar
    </button>


    <div
        id="mensagemLogin"
        class="erro"
    ></div>

</section>


<!-- ==========================================================
     PAINEL
=========================================================== -->

<section id="painel">


    <div class="topo">


        <button
            class="botao-sair"
            onclick="sair()"
        >
            Sair
        </button>


        <h1>
            Painel Administrativo
        </h1>


        <div
            id="usuarioLogado"
            class="usuario-logado"
        ></div>


    </div>


    <!-- ======================================================
         SELEÇÃO DO TESTE
    ======================================================= -->

    <div class="seletor-teste">


        <label
            class="seletor-titulo"
            for="seletorTeste"
        >
            Selecione o teste
        </label>


        <select
            id="seletorTeste"
            onchange="trocarTeste()"
        >

            <option value="numerico">
                Teste de Raciocínio Numérico
            </option>

            <option value="negociacao">
                Teste de Negociação
            </option>

        </select>


    </div>


    <!-- ======================================================
         PESQUISA
    ======================================================= -->

    <div class="pesquisa">


        <label
            class="pesquisa-titulo"
            for="pesquisaNome"
        >
            Pesquisar candidato por nome
        </label>


        <div class="pesquisa-linha">


            <input
                type="text"
                id="pesquisaNome"
                placeholder="Digite o nome do candidato..."
                oninput="filtrarResultados()"
            >


            <button
                class="botao-limpar"
                onclick="limparPesquisa()"
            >
                Limpar
            </button>


            <button
                class="botao-atualizar"
                onclick="atualizarResultados()"
            >
                Atualizar
            </button>


        </div>


        <div
            id="contador"
            class="contador"
        >
            Carregando...
        </div>


    </div>


    <!-- ======================================================
         STATUS
    ======================================================= -->

    <div
        id="status"
        class="carregando"
    >
        Carregando resultados...
    </div>


    <!-- ======================================================
         TABELA
    ======================================================= -->

    <div class="tabela-container">


        <table>


            <thead id="cabecalhoTabela">

                <!-- Preenchido pelo JavaScript -->

            </thead>


            <tbody id="resultados">

            </tbody>


        </table>


    </div>


</section>


<!-- ==========================================================
     ASSINATURA
=========================================================== -->

<div class="assinatura">

    Desenvolvido por :
    Wemerson Leal
    © 2026 -
    RH Garcia Supermercados.

</div>


</div>


<script>


/* ============================================================
   CONFIGURAÇÃO - PROJETO ANTIGO
   RACIOCÍNIO NUMÉRICO
============================================================ */

const NUMERICO_URL =
    "https://rfzauftsgqidtzwtdjlp.supabase.co";


const NUMERICO_KEY =
    "sb_publishable_QAHvlE6BbMgm5nc9WzYJEQ_7f_YvkrU";


/* ============================================================
   CONFIGURAÇÃO - PROJETO NOVO
   NEGOCIAÇÃO
============================================================ */

const NEGOCIACAO_URL =
    "https://wxlltutgwoslyhqvbhqb.supabase.co";


const NEGOCIACAO_KEY =
    "sb_publishable_xgSMPfvdpWLPjwECyOkADw_FR44UcVk";


/* ============================================================
   VARIÁVEIS
============================================================ */

let todosResultados = [];

let accessTokenNumerico = null;

let accessTokenNegociacao = null;

let projetoAtual = "numerico";


/* ============================================================
   CONFIGURAÇÃO DO PROJETO ATUAL
============================================================ */

function obterConfiguracaoAtual() {


    if (
        projetoAtual === "negociacao"
    ) {

        return {

            url:
                NEGOCIACAO_URL,

            key:
                NEGOCIACAO_KEY,

            token:
                accessTokenNegociacao

        };

    }


    return {

        url:
            NUMERICO_URL,

        key:
            NUMERICO_KEY,

        token:
            accessTokenNumerico

    };

}


/* ============================================================
   ENTRAR
============================================================ */

async function entrar() {


    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const senha =
        document
            .getElementById("senha")
            .value;


    const mensagem =
        document.getElementById(
            "mensagemLogin"
        );


    const botao =
        document.getElementById(
            "botaoEntrar"
        );


    mensagem.textContent = "";


    if (
        !email ||
        !senha
    ) {

        mensagem.textContent =
            "Informe seu e-mail e senha.";

        return;

    }


    botao.disabled = true;

    botao.textContent =
        "Entrando...";


    try {


        /*
         * LOGIN NO PROJETO NUMÉRICO
         */

        const respostaNumerico =
            await fetch(

                NUMERICO_URL +
                "/auth/v1/token?grant_type=password",

                {

                    method: "POST",

                    headers: {

                        "apikey":
                            NUMERICO_KEY,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            password:
                                senha

                        })

                }

            );


        const dadosNumerico =
            await respostaNumerico.json();


        if (
            !respostaNumerico.ok
        ) {

            throw new Error(
                "Login no Teste de Raciocínio Numérico: " +
                (
                    dadosNumerico.error_description ||
                    dadosNumerico.msg ||
                    dadosNumerico.message ||
                    "E-mail ou senha incorretos."
                )
            );

        }


        /*
         * LOGIN NO PROJETO NEGOCIAÇÃO
         */

        const respostaNegociacao =
            await fetch(

                NEGOCIACAO_URL +
                "/auth/v1/token?grant_type=password",

                {

                    method: "POST",

                    headers: {

                        "apikey":
                            NEGOCIACAO_KEY,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            password:
                                senha

                        })

                }

            );


        const dadosNegociacao =
            await respostaNegociacao.json();


        if (
            !respostaNegociacao.ok
        ) {

            throw new Error(
                "Login no Teste de Negociação: " +
                (
                    dadosNegociacao.error_description ||
                    dadosNegociacao.msg ||
                    dadosNegociacao.message ||
                    "E-mail ou senha incorretos."
                )
            );

        }


        /*
         * GUARDA OS DOIS TOKENS
         */

        accessTokenNumerico =
            dadosNumerico.access_token;


        accessTokenNegociacao =
            dadosNegociacao.access_token;


        localStorage.setItem(
            "admin_numerico_token",
            accessTokenNumerico
        );


        localStorage.setItem(
            "admin_negociacao_token",
            accessTokenNegociacao
        );


        localStorage.setItem(
            "admin_email",
            email
        );


        mostrarPainel();

    }


    catch (erro) {


        console.error(
            "Erro no login:",
            erro
        );


        mensagem.textContent =
            erro.message;


        botao.disabled =
            false;


        botao.textContent =
            "Entrar";

    }

}


/* ============================================================
   MOSTRAR PAINEL
============================================================ */

function mostrarPainel() {


    document.getElementById(
        "login"
    ).style.display =
        "none";


    document.getElementById(
        "painel"
    ).style.display =
        "block";


    const email =
        localStorage.getItem(
            "admin_email"
        );


    document.getElementById(
        "usuarioLogado"
    ).textContent =

        email
            ? "Usuário conectado: " + email
            : "";


    carregarResultados();

}


/* ============================================================
   TROCAR TESTE
============================================================ */

async function trocarTeste() {


    projetoAtual =
        document.getElementById(
            "seletorTeste"
        ).value;


    todosResultados = [];


    document.getElementById(
        "pesquisaNome"
    ).value = "";


    configurarCabecalho();


    await carregarResultados();

}


/* ============================================================
   CONFIGURAR CABEÇALHO
============================================================ */

function configurarCabecalho() {


    const cabecalho =
        document.getElementById(
            "cabecalhoTabela"
        );


    if (
        projetoAtual ===
        "negociacao"
    ) {


        cabecalho.innerHTML = `

            <tr>

                <th>
                    Candidato
                </th>

                <th>
                    Questões
                </th>

                <th>
                    Pontuação
                </th>

                <th>
                    Classificação
                </th>

                <th>
                    Data
                </th>

                <th>
                    Status
                </th>

            </tr>

        `;

        return;

    }


    cabecalho.innerHTML = `

        <tr>

            <th>
                Candidato
            </th>

            <th>
                Questões
            </th>

            <th>
                Pontuação
            </th>

            <th>
                Aproveitamento
            </th>

            <th>
                Início
            </th>

            <th>
                Finalização
            </th>

        </tr>

    `;

}


/* ============================================================
   CARREGAR RESULTADOS
============================================================ */

async function carregarResultados() {


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Carregando resultados...";


    try {


        const config =
            obterConfiguracaoAtual();


        if (
            !config.token
        ) {

            throw new Error(
                "Sessão administrativa não encontrada."
            );

        }


        let url;


        /*
         * =====================================================
         * NEGOCIAÇÃO
         * =====================================================
         */

        if (
            projetoAtual ===
            "negociacao"
        ) {


            url =
                config.url +
                "/rest/v1/attempts" +
                "?select=id,candidate_id,total_questions,score,classification,created_at,answers" +
                "&order=created_at.desc";


        }


        /*
         * =====================================================
         * RACIOCÍNIO NUMÉRICO
         * =====================================================
         */

        else {


            url =
                config.url +
                "/rest/v1/attempts" +
                "?select=id,candidate_id,total_questions,score,Started_at,Finished_at" +
                "&order=Finished_at.desc";

        }


        const resposta =
            await fetch(

                url,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            config.key,

                        "Authorization":
                            "Bearer " +
                            config.token,

                        "Content-Type":
                            "application/json"

                    }

                }

            );


        const texto =
            await resposta.text();


        let dados;


        try {

            dados =
                texto
                    ? JSON.parse(texto)
                    : [];

        }

        catch {

            dados = [];

        }


        if (
            !resposta.ok
        ) {

            throw new Error(

                dados.message ||
                dados.hint ||
                dados.details ||
                dados.error_description ||
                `HTTP ${resposta.status}`

            );

        }


        todosResultados =
            Array.isArray(dados)
                ? dados
                : [];


        /*
         * Busca os candidatos separadamente.
         * Isso evita depender de relacionamento
         * configurado no Supabase.
         */

        await carregarNomesDosCandidatos(
            config
        );


        status.textContent =
            "";


        filtrarResultados();

    }


    catch (erro) {


        console.error(
            "Erro ao carregar resultados:",
            erro
        );


        status.textContent =
            "Erro ao carregar resultados: " +
            erro.message;


        document.getElementById(
            "contador"
        ).textContent =
            "";

    }

}


/* ============================================================
   CARREGAR NOMES DOS CANDIDATOS
============================================================ */

async function carregarNomesDosCandidatos(
    config
) {


    if (
        todosResultados.length === 0
    ) {

        return;

    }


    const ids =
        [
            ...new Set(

                todosResultados

                    .map(
                        item =>
                            item.candidate_id
                    )

                    .filter(
                        id => id
                    )

            )
        ];


    if (
        ids.length === 0
    ) {

        return;

    }


    const filtro =
        ids
            .map(
                id =>
                    `"${id}"`
            )
            .join(",");


    const url =
        config.url +
        "/rest/v1/candidates" +
        "?select=id,name" +
        "&id=in.(" +
        filtro +
        ")";


    const resposta =
        await fetch(

            url,

            {

                method: "GET",

                headers: {

                    "apikey":
                        config.key,

                    "Authorization":
                        "Bearer " +
                        config.token,

                    "Content-Type":
                        "application/json"

                }

            }

        );


    const texto =
        await resposta.text();


    let candidatos;


    try {

        candidatos =
            texto
                ? JSON.parse(texto)
                : [];

    }

    catch {

        candidatos = [];

    }


    if (
        !resposta.ok
    ) {

        throw new Error(

            candidatos.message ||
            candidatos.hint ||
            candidatos.details ||
            `Erro ao carregar candidatos: HTTP ${resposta.status}`

        );

    }


    const mapa =
        {};


    candidatos.forEach(
        function(candidato) {

            mapa[
                candidato.id
            ] =
                candidato.name || "Sem nome";

        }
    );


    todosResultados =
        todosResultados.map(
            function(tentativa) {

                return {

                    ...tentativa,

                    nomeCandidato:
                        mapa[
                            tentativa.candidate_id
                        ] || "Sem nome"

                };

            }
        );

}


/* ============================================================
   ATUALIZAR
============================================================ */

async function atualizarResultados() {

    await carregarResultados();

}


/* ============================================================
   FILTRAR POR NOME
============================================================ */

function filtrarResultados() {


    const campo =
        document.getElementById(
            "pesquisaNome"
        );


    const texto =
        campo.value
            .trim()
            .toLowerCase();


    const resultadosFiltrados =
        todosResultados.filter(

            function(tentativa) {


                const nome =
                    tentativa.nomeCandidato ||
                    "Sem nome";


                return nome
                    .toLowerCase()
                    .includes(texto);

            }

        );


    mostrarResultados(
        resultadosFiltrados
    );

}


/* ============================================================
   MOSTRAR RESULTADOS
============================================================ */

function mostrarResultados(
    dados
) {


    const tabela =
        document.getElementById(
            "resultados"
        );


    tabela.innerHTML =
        "";


    const contador =
        document.getElementById(
            "contador"
        );


    if (
        dados.length === 0
    ) {


        contador.textContent =
            "Nenhum candidato encontrado.";


        const colunas =
            projetoAtual ===
            "negociacao"
                ? 6
                : 6;


        tabela.innerHTML = `

            <tr>

                <td
                    colspan="${colunas}"
                    class="vazio"
                >

                    Nenhum candidato encontrado.

                </td>

            </tr>

        `;


        return;

    }


    contador.textContent =

        dados.length === 1

            ? "1 resultado encontrado."

            : dados.length +
              " resultados encontrados.";


    dados.forEach(
        function(tentativa) {


            const linha =
                document.createElement(
                    "tr"
                );


            const nome =
                tentativa.nomeCandidato ||
                "Sem nome";


            const total =
                Number(
                    tentativa.total_questions
                ) || 0;


            const score =
                tentativa.score;


            /*
             * =================================================
             * NEGOCIAÇÃO
             * =================================================
             */

            if (
                projetoAtual ===
                "negociacao"
            ) {


                const classificacao =
                    tentativa.classification ||
                    "—";


                let classeBadge =
                    "badge";


                if (
                    classificacao ===
                    "Negociador razoável"
                ) {

                    classeBadge =
                        "badge badge-razoavel";

                }


                if (
                    classificacao ===
                    "Mau Negociador"
                ) {

                    classeBadge =
                        "badge badge-mau";

                }


                let data =
                    "—";


                if (
                    tentativa.created_at
                ) {

                    data =
                        new Date(
                            tentativa.created_at
                        ).toLocaleString(
                            "pt-BR"
                        );

                }


                linha.innerHTML = `

                    <td>
                        ${escaparHTML(nome)}
                    </td>

                    <td>
                        ${total}
                    </td>

                    <td>
                        ${
                            score === null ||
                            score === undefined
                                ? "—"
                                : score
                        }
                    </td>

                    <td>

                        <span
                            class="${classeBadge}"
                        >

                            ${escaparHTML(
                                classificacao
                            )}

                        </span>

                    </td>

                    <td>
                        ${data}
                    </td>

                    <td>

                        <span class="badge">

                            Concluído

                        </span>

                    </td>

                `;

            }


            /*
             * =================================================
             * RACIOCÍNIO NUMÉRICO
             * =================================================
             */

            else {


                let percentual =
                    "—";


                if (
                    score !== null &&
                    score !== undefined &&
                    total > 0
                ) {

                    percentual =
                        Math.round(
                            (
                                Number(score) /
                                total
                            ) *
                            100
                        ) +
                        "%";

                }


                let inicio =
                    "—";


                if (
                    tentativa.Started_at
                ) {

                    inicio =
                        new Date(
                            tentativa.Started_at
                        ).toLocaleString(
                            "pt-BR"
                        );

                }


                let finalizacao =
                    "—";


                if (
                    tentativa.Finished_at
                ) {

                    finalizacao =
                        new Date(
                            tentativa.Finished_at
                        ).toLocaleString(
                            "pt-BR"
                        );

                }


                linha.innerHTML = `

                    <td>
                        ${escaparHTML(nome)}
                    </td>

                    <td>
                        ${total}
                    </td>

                    <td>
                        ${
                            score === null ||
                            score === undefined
                                ? "—"
                                : score
                        }
                    </td>

                    <td>

                        <span class="badge-info badge">

                            ${percentual}

                        </span>

                    </td>

                    <td>
                        ${inicio}
                    </td>

                    <td>

                        ${
                            finalizacao === "—"

                                ? `
                                    <span class="badge">
                                        Em andamento
                                    </span>
                                  `

                                : finalizacao

                        }

                    </td>

                `;

            }


            tabela.appendChild(
                linha
            );

        }
    );

}


/* ============================================================
   LIMPAR PESQUISA
============================================================ */

function limparPesquisa() {


    document.getElementById(
        "pesquisaNome"
    ).value =
        "";


    filtrarResultados();

}


/* ============================================================
   ESCAPAR HTML
============================================================ */

function escaparHTML(
    texto
) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto || "";


    return div.innerHTML;

}


/* ============================================================
   SAIR
============================================================ */

function sair() {


    accessTokenNumerico =
        null;


    accessTokenNegociacao =
        null;


    todosResultados =
        [];


    localStorage.removeItem(
        "admin_numerico_token"
    );


    localStorage.removeItem(
        "admin_negociacao_token"
    );


    localStorage.removeItem(
        "admin_email"
    );


    document.getElementById(
        "painel"
    ).style.display =
        "none";


    document.getElementById(
        "login"
    ).style.display =
        "block";


    document.getElementById(
        "email"
    ).value =
        "";


    document.getElementById(
        "senha"
    ).value =
        "";


    document.getElementById(
        "mensagemLogin"
    ).textContent =
        "";

}


/* ============================================================
   RECUPERAR SESSÃO
============================================================ */

const tokenNumericoSalvo =
    localStorage.getItem(
        "admin_numerico_token"
    );


const tokenNegociacaoSalvo =
    localStorage.getItem(
        "admin_negociacao_token"
    );


const emailSalvo =
    localStorage.getItem(
        "admin_email"
    );


if (
    tokenNumericoSalvo &&
    tokenNegociacaoSalvo &&
    emailSalvo
) {


    accessTokenNumerico =
        tokenNumericoSalvo;


    accessTokenNegociacao =
        tokenNegociacaoSalvo;


    mostrarPainel();

}


else {


    localStorage.removeItem(
        "admin_numerico_token"
    );


    localStorage.removeItem(
        "admin_negociacao_token"
    );


    localStorage.removeItem(
        "admin_email"
    );

}


/* ============================================================
   INICIALIZAÇÃO
============================================================ */

configurarCabecalho();

</script>
