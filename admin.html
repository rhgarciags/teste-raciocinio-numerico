<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    min-height: 100vh;
}

.container {
    max-width: 1100px;
    width: 100%;
    margin: 40px auto;
    padding: 30px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
}

#painel {
    display: none;
}

#login {
    max-width: 450px;
    margin: 0 auto;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

label {
    font-weight: bold;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.botao-sair {
    background: #dc2626;
    float: right;
}

.botao-sair:hover {
    background: #b91c1c;
}

.erro {
    color: #dc2626;
    margin-top: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.status {
    margin-top: 15px;
    padding: 15px;
    border-radius: 8px;
    background: #f9fafb;
}

.seletor-testes {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 25px 0;
}

.botao-teste {
    background: #e5e7eb;
    color: #1f2937;
}

.botao-teste:hover {
    background: #d1d5db;
}

.botao-teste.ativo {
    background: #2563eb;
    color: white;
}

.pesquisa {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}

.pesquisa-linha {
    display: flex;
    gap: 10px;
    align-items: center;
}

.pesquisa-linha input {
    margin: 0;
    flex: 1;
}

.botao-limpar {
    background: #6b7280;
}

.botao-atualizar {
    background: #2563eb;
}

.contador {
    margin-top: 12px;
    color: #6b7280;
    font-size: 14px;
}

.tabela-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th,
td {
    padding: 13px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #f9fafb;
}

tr:hover {
    background: #f9fafb;
}

.vazio {
    text-align: center;
    padding: 40px;
    color: #6b7280;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    background: #dcfce7;
    color: #166534;
}

.usuario {
    color: #6b7280;
    font-size: 14px;
}

.assinatura {
    text-align: center;
    color: #9ca3af;
    font-size: 10px;
    margin-top: 30px;
}

@media (max-width: 700px) {

    .container {
        margin: 15px;
        padding: 20px;
    }

    .pesquisa-linha {
        flex-direction: column;
        align-items: stretch;
    }

    .pesquisa-linha button {
        width: 100%;
    }

    .seletor-testes {
        flex-direction: column;
    }

    .botao-teste {
        width: 100%;
    }

}

</style>

</head>

<body>

<div class="container">


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="login">

    <h1>Painel Administrativo</h1>

    <p>
        Acesse os resultados dos testes.
    </p>

    <label for="email">
        E-mail
    </label>

    <input
        type="email"
        id="email"
        placeholder="Seu e-mail"
        autocomplete="email"
    >

    <label for="senha">
        Senha
    </label>

    <input
        type="password"
        id="senha"
        placeholder="Sua senha"
        autocomplete="current-password"
    >

    <button
        id="botaoEntrar"
        onclick="entrar()"
    >
        Entrar
    </button>

    <div
        id="mensagemLogin"
        class="erro"
    ></div>

</section>


<!-- =====================================================
     PAINEL
===================================================== -->

<section id="painel">

    <button
        class="botao-sair"
        onclick="sair()"
    >
        Sair
    </button>

    <h1>
        Painel Administrativo
    </h1>

    <div
        id="usuarioLogado"
        class="usuario"
    ></div>

    <p>
        Selecione o teste que deseja consultar:
    </p>


    <!-- =================================================
         TESTES
    ================================================== -->

    <div class="seletor-testes">

        <button
            id="botaoNumerico"
            class="botao-teste"
            onclick="selecionarTeste('numerico')"
        >
            Teste de Raciocínio Numérico
        </button>

        <button
            id="botaoNegociacao"
            class="botao-teste"
            onclick="selecionarTeste('negociacao')"
        >
            Teste de Negociação
        </button>

    </div>


    <h2 id="tituloTeste">
        Selecione um teste
    </h2>


    <!-- =================================================
         RESULTADOS
    ================================================== -->

    <div id="areaResultados">

        <div class="pesquisa">

            <label for="pesquisaNome">
                Pesquisar candidato por nome
            </label>

            <div class="pesquisa-linha">

                <input
                    type="text"
                    id="pesquisaNome"
                    placeholder="Digite o nome do candidato..."
                    oninput="filtrarResultados()"
                >

                <button
                    class="botao-limpar"
                    onclick="limparPesquisa()"
                >
                    Limpar
                </button>

                <button
                    class="botao-atualizar"
                    onclick="carregarResultados()"
                >
                    Atualizar
                </button>

            </div>

            <div
                id="contador"
                class="contador"
            >
                Selecione um teste.
            </div>

        </div>


        <div
            id="status"
            class="status"
        >
            Selecione um teste para carregar os resultados.
        </div>


        <div class="tabela-container">

            <table>

                <thead id="cabecalhoTabela">
                </thead>

                <tbody id="resultados">
                </tbody>

            </table>

        </div>

    </div>

</section>


<!-- =====================================================
     ASSINATURA
===================================================== -->

<div class="assinatura">

    Desenvolvido por Wemerson Leal
    © 2026 - RH Garcia Supermercados.

</div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO - RACIOCÍNIO NUMÉRICO
========================================================= */

const NUMERICO_URL =
    "https://rfzauftsgqidtzwtdjlp.supabase.co";

const NUMERICO_KEY =
    "sb_publishable_QAHvlE6BbMgm5nc9WzYJEQ_7f_YvkrU";


/* =========================================================
   CONFIGURAÇÃO - NEGOCIAÇÃO
========================================================= */

const NEGOCIACAO_URL =
    "https://wxlltutgwoslyhqvbhqb.supabase.co";

const NEGOCIACAO_KEY =
    "sb_publishable_xgSMPfvdpWLPjwECyOkADw_FR44UcVk";


/* =========================================================
   VARIÁVEIS
========================================================= */

let accessToken = null;

let testeAtual = null;

let todosResultados = [];

let candidatosNegociacao = [];


/* =========================================================
   LOGIN
========================================================= */

async function entrar() {

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const senha =
        document
        .getElementById("senha")
        .value;

    const mensagem =
        document
        .getElementById("mensagemLogin");

    const botao =
        document
        .getElementById("botaoEntrar");


    mensagem.textContent = "";


    if (!email || !senha) {

        mensagem.textContent =
            "Informe seu e-mail e senha.";

        return;
    }


    botao.disabled = true;

    botao.textContent =
        "Entrando...";


    try {

        const resposta =
            await fetch(
                NUMERICO_URL +
                "/auth/v1/token?grant_type=password",
                {
                    method: "POST",

                    headers: {

                        "apikey":
                            NUMERICO_KEY,

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email: email,

                            password: senha

                        })
                }
            );


        const texto =
            await resposta.text();


        let dados = {};


        try {

            dados =
                texto
                ? JSON.parse(texto)
                : {};

        } catch {

            dados = {};

        }


        if (!resposta.ok) {

            throw new Error(

                dados.error_description ||

                dados.msg ||

                dados.message ||

                "E-mail ou senha incorretos."

            );
        }


        if (!dados.access_token) {

            throw new Error(
                "O Supabase não retornou o token de acesso."
            );
        }


        accessToken =
            dados.access_token;


        localStorage.setItem(
            "painel_access_token",
            accessToken
        );


        localStorage.setItem(
            "painel_email",
            email
        );


        mostrarPainel();

    }

    catch (erro) {

        console.error(
            "Erro no login:",
            erro
        );


        mensagem.textContent =
            "Não foi possível fazer login.\n\n" +
            erro.message;


        botao.disabled = false;

        botao.textContent =
            "Entrar";
    }
}


/* =========================================================
   MOSTRAR PAINEL
========================================================= */

function mostrarPainel() {

    document.getElementById(
        "login"
    ).style.display =
        "none";


    document.getElementById(
        "painel"
    ).style.display =
        "block";


    const email =
        localStorage.getItem(
            "painel_email"
        );


    document.getElementById(
        "usuarioLogado"
    ).textContent =
        email
        ? "Usuário conectado: " + email
        : "";
}


/* =========================================================
   SELECIONAR TESTE
========================================================= */

function selecionarTeste(
    teste
) {

    testeAtual =
        teste;


    todosResultados =
        [];


    candidatosNegociacao =
        [];


    document.getElementById(
        "pesquisaNome"
    ).value =
        "";


    document.getElementById(
        "botaoNumerico"
    ).classList.remove(
        "ativo"
    );


    document.getElementById(
        "botaoNegociacao"
    ).classList.remove(
        "ativo"
    );


    if (
        teste === "numerico"
    ) {

        document.getElementById(
            "botaoNumerico"
        ).classList.add(
            "ativo"
        );


        document.getElementById(
            "tituloTeste"
        ).textContent =
            "Teste de Raciocínio Numérico";


        document.getElementById(
            "cabecalhoTabela"
        ).innerHTML = `

            <tr>

                <th>
                    Candidato
                </th>

                <th>
                    Questões
                </th>

                <th>
                    Pontuação
                </th>

                <th>
                    Taxa de aproveitamento
                </th>

                <th>
                    Status
                </th>

            </tr>

        `;

    }


    if (
        teste === "negociacao"
    ) {

        document.getElementById(
            "botaoNegociacao"
        ).classList.add(
            "ativo"
        );


        document.getElementById(
            "tituloTeste"
        ).textContent =
            "Teste de Negociação";


        document.getElementById(
            "cabecalhoTabela"
        ).innerHTML = `

            <tr>

                <th>
                    Candidato
                </th>

                <th>
                    Questões
                </th>

                <th>
                    Pontuação
                </th>

                <th>
                    Classificação
                </th>

                <th>
                    Status
                </th>

            </tr>

        `;

    }


    carregarResultados();
}


/* =========================================================
   CARREGAR RESULTADOS
========================================================= */

async function carregarResultados() {

    if (!testeAtual) {

        return;
    }


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Carregando resultados...";


    try {

        /* =================================================
           RACIOCÍNIO NUMÉRICO
        ================================================= */

        if (
            testeAtual === "numerico"
        ) {

            const consulta =
                "/rest/v1/attempts" +
                "?select=id,candidate_id,score,total_questions,candidates(name)";


            const resposta =
                await fetch(

                    NUMERICO_URL +
                    consulta,

                    {
                        method: "GET",

                        headers: {

                            "apikey":
                                NUMERICO_KEY,

                            "Authorization":
                                "Bearer " +
                                accessToken,

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        }
                    }

                );


            await processarResposta(
                resposta
            );


            return;
        }


        /* =================================================
           NEGOCIAÇÃO
        ================================================= */

        if (
            testeAtual === "negociacao"
        ) {

            /*
               PRIMEIRO:

               Busca as tentativas.
            */

            const respostaAttempts =
                await fetch(

                    NEGOCIACAO_URL +
                    "/rest/v1/attempts" +
                    "?select=id,candidate_id,score,total_questions,classification",

                    {
                        method: "GET",

                        headers: {

                            "apikey":
                                NEGOCIACAO_KEY,

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        }
                    }

                );


            const textoAttempts =
                await respostaAttempts.text();


            let dadosAttempts = [];


            try {

                dadosAttempts =
                    textoAttempts
                    ? JSON.parse(textoAttempts)
                    : [];

            } catch {

                dadosAttempts = [];

            }


            if (
                !respostaAttempts.ok
            ) {

                throw new Error(

                    dadosAttempts.message ||

                    dadosAttempts.hint ||

                    dadosAttempts.details ||

                    "Erro ao consultar attempts."

                );

            }


            /*
               SEGUNDO:

               Busca os candidatos separadamente.
            */

            const respostaCandidates =
                await fetch(

                    NEGOCIACAO_URL +
                    "/rest/v1/candidates" +
                    "?select=id,name",

                    {
                        method: "GET",

                        headers: {

                            "apikey":
                                NEGOCIACAO_KEY,

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        }
                    }

                );


            const textoCandidates =
                await respostaCandidates.text();


            let dadosCandidates = [];


            try {

                dadosCandidates =
                    textoCandidates
                    ? JSON.parse(textoCandidates)
                    : [];

            } catch {

                dadosCandidates = [];

            }


            if (
                !respostaCandidates.ok
            ) {

                throw new Error(

                    dadosCandidates.message ||

                    dadosCandidates.hint ||

                    dadosCandidates.details ||

                    "Erro ao consultar candidates."

                );

            }


            candidatosNegociacao =
                Array.isArray(
                    dadosCandidates
                )
                ? dadosCandidates
                : [];


            /*
               TERCEIRO:

               Junta o nome ao resultado
               através do candidate_id.
            */

            todosResultados =
                (Array.isArray(
                    dadosAttempts
                )
                ? dadosAttempts
                : [])
                .map(
                    function(attempt) {

                        const candidato =
                            candidatosNegociacao.find(
                                function(candidato) {

                                    return String(
                                        candidato.id
                                    ) === String(
                                        attempt.candidate_id
                                    );

                                }
                            );


                        return {

                            ...attempt,

                            candidates:
                                candidato
                                ? {
                                    name:
                                        candidato.name
                                  }
                                : null

                        };

                    }
                );


            status.textContent =
                "";


            filtrarResultados();


            return;
        }

    }

    catch (erro) {

        console.error(
            "Erro ao carregar resultados:",
            erro
        );


        status.textContent =
            "Erro ao carregar resultados: " +
            erro.message;


        document.getElementById(
            "contador"
        ).textContent =
            "";

    }
}


/* =========================================================
   PROCESSAR RESPOSTA DO NUMÉRICO
========================================================= */

async function processarResposta(
    resposta
) {

    const status =
        document.getElementById(
            "status"
        );


    const texto =
        await resposta.text();


    let dados = [];


    try {

        dados =
            texto
            ? JSON.parse(texto)
            : [];

    } catch {

        dados = [];

    }


    if (
        !resposta.ok
    ) {

        throw new Error(

            dados.message ||

            dados.hint ||

            dados.details ||

            "HTTP " +
            resposta.status

        );

    }


    todosResultados =
        Array.isArray(dados)
        ? dados
        : [];


    status.textContent =
        "";


    filtrarResultados();
}


/* =========================================================
   FILTRAR RESULTADOS
========================================================= */

function filtrarResultados() {

    const campo =
        document.getElementById(
            "pesquisaNome"
        );


    const texto =
        campo.value
        .trim()
        .toLowerCase();


    const filtrados =
        todosResultados.filter(

            function(item) {

                const nome =
                    item.candidates &&
                    item.candidates.name
                    ? item.candidates.name
                    : "Sem nome";


                return nome
                    .toLowerCase()
                    .includes(texto);

            }

        );


    mostrarResultados(
        filtrados
    );
}


/* =========================================================
   MOSTRAR RESULTADOS
========================================================= */

function mostrarResultados(
    dados
) {

    const tabela =
        document.getElementById(
            "resultados"
        );


    const contador =
        document.getElementById(
            "contador"
        );


    tabela.innerHTML =
        "";


    if (
        dados.length === 0
    ) {

        contador.textContent =
            "Nenhum candidato encontrado.";


        tabela.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="vazio"
                >

                    Nenhum candidato encontrado.

                </td>

            </tr>

        `;


        return;
    }


    contador.textContent =
        dados.length === 1
        ? "1 resultado encontrado."
        : dados.length +
          " resultados encontrados.";


    dados.forEach(

        function(item) {

            const linha =
                document.createElement(
                    "tr"
                );


            const nome =
                item.candidates &&
                item.candidates.name
                ? item.candidates.name
                : "Sem nome";


            const total =
                item.total_questions ??
                0;


            const score =
                item.score ??
                "—";


            /* =================================================
               RACIOCÍNIO NUMÉRICO
            ================================================= */

            if (
                testeAtual === "numerico"
            ) {

                let aproveitamento =
                    "—";


                if (

                    item.score !== null &&

                    item.score !== undefined &&

                    Number(total) > 0

                ) {

                    aproveitamento =

                        Math.round(

                            (

                                Number(
                                    item.score
                                )

                                /

                                Number(
                                    total
                                )

                            ) * 100

                        ) + "%";

                }


                linha.innerHTML = `

                    <td>
                        ${escaparHTML(nome)}
                    </td>

                    <td>
                        ${escaparHTML(
                            String(total)
                        )}
                    </td>

                    <td>
                        ${escaparHTML(
                            String(score)
                        )}
                    </td>

                    <td>
                        ${aproveitamento}
                    </td>

                    <td>

                        <span class="badge">
                            Concluído
                        </span>

                    </td>

                `;

            }


            /* =================================================
               NEGOCIAÇÃO
            ================================================= */

            if (
                testeAtual === "negociacao"
            ) {

                const classificacao =
                    item.classification ||
                    "—";


                linha.innerHTML = `

                    <td>
                        ${escaparHTML(nome)}
                    </td>

                    <td>
                        ${escaparHTML(
                            String(total)
                        )}
                    </td>

                    <td>
                        ${escaparHTML(
                            String(score)
                        )}
                    </td>

                    <td>

                        <span class="badge">
                            ${escaparHTML(
                                String(
                                    classificacao
                                )
                            )}
                        </span>

                    </td>

                    <td>

                        <span class="badge">
                            Concluído
                        </span>

                    </td>

                `;

            }


            tabela.appendChild(
                linha
            );

        }

    );
}


/* =========================================================
   LIMPAR PESQUISA
========================================================= */

function limparPesquisa() {

    document.getElementById(
        "pesquisaNome"
    ).value =
        "";


    filtrarResultados();
}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(
    texto
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto ?? "";


    return div.innerHTML;
}


/* =========================================================
   SAIR
========================================================= */

function sair() {

    accessToken =
        null;


    testeAtual =
        null;


    todosResultados =
        [];


    candidatosNegociacao =
        [];


    localStorage.removeItem(
        "painel_access_token"
    );


    localStorage.removeItem(
        "painel_email"
    );


    document.getElementById(
        "painel"
    ).style.display =
        "none";


    document.getElementById(
        "login"
    ).style.display =
        "block";


    document.getElementById(
        "email"
    ).value =
        "";


    document.getElementById(
        "senha"
    ).value =
        "";


    document.getElementById(
        "mensagemLogin"
    ).textContent =
        "";


    document.getElementById(
        "resultados"
    ).innerHTML =
        "";


    document.getElementById(
        "contador"
    ).textContent =
        "";


    document.getElementById(
        "status"
    ).textContent =
        "Selecione um teste para carregar os resultados.";

}


/* =========================================================
   RECUPERAR LOGIN
========================================================= */

const tokenSalvo =
    localStorage.getItem(
        "painel_access_token"
    );


if (
    tokenSalvo
) {

    accessToken =
        tokenSalvo;


    mostrarPainel();

}

</script>

</body>

</html>
