<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo - Testes</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    min-height: 100vh;
}

.container {
    max-width: 1200px;
    width: 100%;
    margin: 40px auto;
    padding: 30px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
    color: #111827;
}

#painel {
    display: none;
}

#login {
    max-width: 450px;
    margin: 0 auto;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

label {
    font-weight: bold;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.botao-entrar {
    width: 100%;
}

.botao-sair {
    background: #dc2626;
    float: right;
}

.botao-sair:hover {
    background: #b91c1c;
}

.botao-atualizar {
    background: #2563eb;
}

.botao-limpar {
    background: #6b7280;
}

.botao-limpar:hover {
    background: #4b5563;
}

.erro {
    color: #dc2626;
    margin-top: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.sucesso {
    color: #15803d;
    margin-top: 15px;
}

.usuario-logado {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 20px;
}

/* SELEÇÃO DOS TESTES */

.selecao-testes {
    margin: 25px 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.botao-teste {
    padding: 20px;
    border: 2px solid #d1d5db;
    border-radius: 12px;
    background: #f9fafb;
    color: #1f2937;
    text-align: left;
    cursor: pointer;
    transition: .2s;
}

.botao-teste:hover {
    border-color: #2563eb;
    background: #eff6ff;
}

.botao-teste.ativo {
    border-color: #2563eb;
    background: #dbeafe;
    color: #1d4ed8;
}

.botao-teste-titulo {
    display: block;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
}

.botao-teste-descricao {
    display: block;
    font-size: 13px;
    color: #6b7280;
    font-weight: normal;
}

/* CABEÇALHO */

.topo {
    overflow: hidden;
    margin-bottom: 20px;
}

.topo h1 {
    margin-bottom: 8px;
}

/* PESQUISA */

.pesquisa {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
}

.pesquisa-titulo {
    display: block;
    margin-bottom: 8px;
}

.pesquisa-linha {
    display: flex;
    gap: 10px;
    align-items: center;
}

.pesquisa-linha input {
    margin: 0;
    flex: 1;
}

.contador {
    margin-top: 12px;
    color: #6b7280;
    font-size: 14px;
}

/* STATUS */

.carregando {
    text-align: center;
    padding: 25px;
    color: #6b7280;
}

/* TABELA */

.tabela-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th,
td {
    padding: 13px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #f9fafb;
    font-weight: bold;
}

tr:hover {
    background: #f9fafb;
}

.vazio {
    text-align: center;
    padding: 40px;
    color: #6b7280;
}

/* BADGES */

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    background: #dcfce7;
    color: #166534;
}

.badge-razoavel {
    background: #fef3c7;
    color: #92400e;
}

.badge-mau {
    background: #fee2e2;
    color: #991b1b;
}

.badge-aproveitamento {
    background: #dbeafe;
    color: #1e40af;
}

/* ASSINATURA */

.assinatura {
    text-align: center;
    color: #9ca3af;
    font-size: 10px;
    margin-top: 25px;
    padding-bottom: 12px;
}

/* MOBILE */

@media (max-width: 700px) {

    .container {
        margin: 15px;
        padding: 20px;
        width: auto;
    }

    .selecao-testes {
        grid-template-columns: 1fr;
    }

    .pesquisa-linha {
        flex-direction: column;
        align-items: stretch;
    }

    .pesquisa-linha button {
        width: 100%;
    }

    table {
        font-size: 14px;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- =====================================================
     LOGIN
===================================================== -->

<section id="login">

    <h1>Painel Administrativo</h1>

    <p>
        Acesse os resultados dos testes.
    </p>

    <label for="email">
        E-mail
    </label>

    <input
        type="email"
        id="email"
        placeholder="Seu e-mail"
        autocomplete="email"
    >

    <label for="senha">
        Senha
    </label>

    <input
        type="password"
        id="senha"
        placeholder="Sua senha"
        autocomplete="current-password"
    >

    <button
        class="botao-entrar"
        onclick="entrar()"
        id="botaoEntrar"
    >
        Entrar
    </button>

    <div
        id="mensagemLogin"
        class="erro"
    ></div>

</section>


<!-- =====================================================
     PAINEL
===================================================== -->

<section id="painel">

    <div class="topo">

        <button
            class="botao-sair"
            onclick="sair()"
        >
            Sair
        </button>

        <h1>
            Painel de Resultados
        </h1>

        <div
            id="usuarioLogado"
            class="usuario-logado"
        ></div>

    </div>


    <!-- =================================================
         SELEÇÃO DO TESTE
    ================================================== -->

    <h3>
        Selecione o teste
    </h3>

    <div class="selecao-testes">

        <button
            type="button"
            class="botao-teste ativo"
            id="botaoNumerico"
            onclick="selecionarTeste('numerico')"
        >

            <span class="botao-teste-titulo">
                Teste de Raciocínio Numérico
            </span>

            <span class="botao-teste-descricao">
                Visualizar pontuação e taxa de aproveitamento.
            </span>

        </button>


        <button
            type="button"
            class="botao-teste"
            id="botaoNegociacao"
            onclick="selecionarTeste('negociacao')"
        >

            <span class="botao-teste-titulo">
                Teste de Negociação
            </span>

            <span class="botao-teste-descricao">
                Visualizar pontuação e classificação.
            </span>

        </button>

    </div>


    <!-- =================================================
         TÍTULO ATUAL
    ================================================== -->

    <h2 id="tituloTeste">
        Teste de Raciocínio Numérico
    </h2>


    <!-- =================================================
         PESQUISA
    ================================================== -->

    <div class="pesquisa">

        <label
            class="pesquisa-titulo"
            for="pesquisaNome"
        >
            Pesquisar candidato por nome
        </label>

        <div class="pesquisa-linha">

            <input
                type="text"
                id="pesquisaNome"
                placeholder="Digite o nome do candidato..."
                oninput="filtrarResultados()"
            >

            <button
                class="botao-limpar"
                onclick="limparPesquisa()"
            >
                Limpar
            </button>

            <button
                class="botao-atualizar"
                onclick="atualizarResultados()"
            >
                Atualizar
            </button>

        </div>

        <div
            id="contador"
            class="contador"
        >
            Carregando...
        </div>

    </div>


    <!-- =================================================
         STATUS
    ================================================== -->

    <div
        id="status"
        class="carregando"
    >
        Carregando resultados...
    </div>


    <!-- =================================================
         TABELA
    ================================================== -->

    <div class="tabela-container">

        <table>

            <thead id="cabecalhoTabela">
            </thead>

            <tbody id="resultados">
            </tbody>

        </table>

    </div>

</section>


<!-- =====================================================
     ASSINATURA
===================================================== -->

<div class="assinatura">
    Desenvolvido por : Wemerson Leal © 2026 - RH Garcia Supermercados.
</div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO DOS DOIS SUPABASE
===================================================== */


/* -----------------------------------------------------
   RACIOCÍNIO NUMÉRICO
----------------------------------------------------- */

const NUMERICO_URL =
    "https://rfzauftsgqidtzwtdjlp.supabase.co";

const NUMERICO_KEY =
    "sb_publishable_QAHvlE6BbMgm5nc9WzYJEQ_7f_YvkrU";


/* -----------------------------------------------------
   NEGOCIAÇÃO
----------------------------------------------------- */

const NEGOCIACAO_URL =
    "https://wasgpxeorsmhrryrnoih.supabase.co";

const NEGOCIACAO_KEY =
    "sb_publishable_9rZ70PM0VmmkQSUfd2AiPw_tJf2XU9_";


/* =====================================================
   VARIÁVEIS
===================================================== */

let testeAtual = "numerico";

let todosResultados = [];

let sessaoNumerico = null;

let sessaoNegociacao = null;

let emailAdministrador = "";


/* =====================================================
   LOGIN
===================================================== */

async function entrar() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const senha =
        document
            .getElementById("senha")
            .value;

    const mensagem =
        document.getElementById(
            "mensagemLogin"
        );

    const botao =
        document.getElementById(
            "botaoEntrar"
        );

    mensagem.textContent = "";

    if (!email || !senha) {

        mensagem.textContent =
            "Informe seu e-mail e senha.";

        return;
    }

    botao.disabled = true;

    botao.textContent =
        "Entrando...";

    try {

        /*
         * O usuário precisa existir
         * nos dois projetos Supabase.
         *
         * Primeiro autenticamos no projeto
         * de Raciocínio Numérico.
         */

        const loginNumerico =
            await autenticar(
                NUMERICO_URL,
                NUMERICO_KEY,
                email,
                senha
            );


        /*
         * Depois autenticamos no projeto
         * de Negociação.
         */

        const loginNegociacao =
            await autenticar(
                NEGOCIACAO_URL,
                NEGOCIACAO_KEY,
                email,
                senha
            );


        sessaoNumerico =
            loginNumerico;

        sessaoNegociacao =
            loginNegociacao;

        emailAdministrador =
            email;


        /*
         * Salva apenas os tokens.
         */

        localStorage.setItem(
            "painel_email",
            email
        );

        localStorage.setItem(
            "painel_numerico_token",
            loginNumerico.access_token
        );

        localStorage.setItem(
            "painel_numerico_refresh",
            loginNumerico.refresh_token
        );

        localStorage.setItem(
            "painel_negociacao_token",
            loginNegociacao.access_token
        );

        localStorage.setItem(
            "painel_negociacao_refresh",
            loginNegociacao.refresh_token
        );


        mostrarPainel();

    }

    catch (erro) {

        console.error(
            "Erro no login:",
            erro
        );

        mensagem.textContent =
            erro.message ||
            "Não foi possível fazer login.";

        botao.disabled = false;

        botao.textContent =
            "Entrar";
    }

}


/* =====================================================
   AUTENTICAR EM UM PROJETO SUPABASE
===================================================== */

async function autenticar(
    url,
    key,
    email,
    senha
) {

    let resposta;

    try {

        resposta =
            await fetch(
                url +
                "/auth/v1/token?grant_type=password",
                {
                    method: "POST",

                    headers: {
                        "apikey": key,
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            email: email,
                            password: senha
                        })
                }
            );

    }

    catch (erro) {

        throw new Error(
            "Não foi possível conectar ao Supabase."
        );

    }


    let dados = {};

    try {

        dados =
            await resposta.json();

    }

    catch {

        dados = {};

    }


    if (!resposta.ok) {

        throw new Error(
            dados.error_description ||
            dados.msg ||
            dados.message ||
            "E-mail ou senha incorretos."
        );

    }


    if (!dados.access_token) {

        throw new Error(
            "O Supabase não retornou o token de acesso."
        );

    }


    return dados;
}


/* =====================================================
   MOSTRAR PAINEL
===================================================== */

function mostrarPainel() {

    document.getElementById(
        "login"
    ).style.display =
        "none";

    document.getElementById(
        "painel"
    ).style.display =
        "block";


    document.getElementById(
        "usuarioLogado"
    ).textContent =
        emailAdministrador
            ? "Usuário conectado: " +
              emailAdministrador
            : "";


    selecionarTeste(
        testeAtual
    );

}


/* =====================================================
   SELECIONAR TESTE
===================================================== */

async function selecionarTeste(
    teste
) {

    testeAtual =
        teste;

    todosResultados =
        [];


    /*
     * Atualiza os botões.
     */

    document.getElementById(
        "botaoNumerico"
    ).classList.toggle(
        "ativo",
        teste === "numerico"
    );


    document.getElementById(
        "botaoNegociacao"
    ).classList.toggle(
        "ativo",
        teste === "negociacao"
    );


    /*
     * Atualiza título.
     */

    if (teste === "numerico") {

        document.getElementById(
            "tituloTeste"
        ).textContent =
            "Teste de Raciocínio Numérico";

    }

    else {

        document.getElementById(
            "tituloTeste"
        ).textContent =
            "Teste de Negociação";

    }


    /*
     * Limpa pesquisa.
     */

    document.getElementById(
        "pesquisaNome"
    ).value =
        "";


    /*
     * Carrega os resultados.
     */

    await carregarResultados();

}


/* =====================================================
   CARREGAR RESULTADOS
===================================================== */

async function carregarResultados() {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Carregando resultados...";


    document.getElementById(
        "contador"
    ).textContent =
        "";


    try {

        if (testeAtual === "numerico") {

            await carregarNumerico();

        }

        else {

            await carregarNegociacao();

        }


        status.textContent = "";

        filtrarResultados();

    }

    catch (erro) {

        console.error(
            "Erro ao carregar resultados:",
            erro
        );

        status.textContent =
            "Erro ao carregar resultados: " +
            erro.message;

        document.getElementById(
            "contador"
        ).textContent =
            "";

    }

}


/* =====================================================
   CARREGAR RACIOCÍNIO NUMÉRICO
===================================================== */

async function carregarNumerico() {

    if (!sessaoNumerico) {

        throw new Error(
            "Sessão do Raciocínio Numérico não encontrada."
        );

    }


    /*
     * IMPORTANTE:
     *
     * Não usamos created_at.
     * Não usamos Started_at.
     * Não usamos Finished_at.
     *
     * Somente as colunas existentes:
     *
     * attempts:
     * id
     * candidate_id
     * score
     * total_questions
     *
     * candidates:
     * id
     * name
     */

    const url =
        NUMERICO_URL +
        "/rest/v1/attempts" +
        "?select=id,candidate_id,score,total_questions,candidates(name)" +
        "&order=id.desc";


    const resposta =
        await fetch(
            url,
            {
                method: "GET",

                headers: {

                    "apikey":
                        NUMERICO_KEY,

                    "Authorization":
                        "Bearer " +
                        sessaoNumerico.access_token,

                    "Content-Type":
                        "application/json"

                }
            }
        );


    const texto =
        await resposta.text();


    let dados = [];

    try {

        dados =
            texto
                ? JSON.parse(texto)
                : [];

    }

    catch {

        dados = [];

    }


    if (!resposta.ok) {

        throw new Error(
            dados.message ||
            dados.hint ||
            dados.details ||
            `HTTP ${resposta.status}`
        );

    }


    todosResultados =
        Array.isArray(dados)
            ? dados
            : [];

}


/* =====================================================
   CARREGAR NEGOCIAÇÃO
===================================================== */

async function carregarNegociacao() {

    if (!sessaoNegociacao) {

        throw new Error(
            "Sessão de Negociação não encontrada."
        );

    }


    /*
     * IMPORTANTE:
     *
     * Não usamos created_at.
     * Não usamos Started_at.
     * Não usamos Finished_at.
     *
     * Somente:
     *
     * attempts:
     * id
     * candidate_id
     * score
     * total_questions
     * classification
     * answers
     *
     * candidates:
     * id
     * name
     */

    const url =
        NEGOCIACAO_URL +
        "/rest/v1/attempts" +
        "?select=id,candidate_id,score,total_questions,classification,answers,candidates(name)" +
        "&order=id.desc";


    const resposta =
        await fetch(
            url,
            {
                method: "GET",

                headers: {

                    "apikey":
                        NEGOCIACAO_KEY,

                    "Authorization":
                        "Bearer " +
                        sessaoNegociacao.access_token,

                    "Content-Type":
                        "application/json"

                }
            }
        );


    const texto =
        await resposta.text();


    let dados = [];

    try {

        dados =
            texto
                ? JSON.parse(texto)
                : [];

    }

    catch {

        dados = [];

    }


    if (!resposta.ok) {

        throw new Error(
            dados.message ||
            dados.hint ||
            dados.details ||
            `HTTP ${resposta.status}`
        );

    }


    todosResultados =
        Array.isArray(dados)
            ? dados
            : [];

}


/* =====================================================
   ATUALIZAR RESULTADOS
===================================================== */

async function atualizarResultados() {

    await carregarResultados();

}


/* =====================================================
   FILTRAR POR NOME
===================================================== */

function filtrarResultados() {

    const campo =
        document.getElementById(
            "pesquisaNome"
        );


    const texto =
        campo.value
            .trim()
            .toLowerCase();


    const resultadosFiltrados =
        todosResultados.filter(
            function(tentativa) {

                const nome =
                    tentativa.candidates &&
                    tentativa.candidates.name
                        ? tentativa.candidates.name
                        : "Sem nome";


                return nome
                    .toLowerCase()
                    .includes(texto);

            }
        );


    mostrarResultados(
        resultadosFiltrados
    );

}


/* =====================================================
   CABEÇALHO DA TABELA
===================================================== */

function montarCabecalho() {

    const cabecalho =
        document.getElementById(
            "cabecalhoTabela"
        );


    if (testeAtual === "numerico") {

        cabecalho.innerHTML = `

            <tr>

                <th>
                    Candidato
                </th>

                <th>
                    Questões
                </th>

                <th>
                    Pontuação
                </th>

                <th>
                    Taxa de aproveitamento
                </th>

                <th>
                    Status
                </th>

            </tr>

        `;

    }

    else {

        cabecalho.innerHTML = `

            <tr>

                <th>
                    Candidato
                </th>

                <th>
                    Questões
                </th>

                <th>
                    Pontuação
                </th>

                <th>
                    Classificação
                </th>

                <th>
                    Status
                </th>

            </tr>

        `;

    }

}


/* =====================================================
   MOSTRAR RESULTADOS
===================================================== */

function mostrarResultados(
    dados
) {

    montarCabecalho();


    const tabela =
        document.getElementById(
            "resultados"
        );


    tabela.innerHTML =
        "";


    const contador =
        document.getElementById(
            "contador"
        );


    if (dados.length === 0) {

        contador.textContent =
            "Nenhum candidato encontrado.";


        const colspan =
            5;


        tabela.innerHTML = `

            <tr>

                <td
                    colspan="${colspan}"
                    class="vazio"
                >

                    Nenhum candidato encontrado.

                </td>

            </tr>

        `;

        return;
    }


    contador.textContent =
        dados.length === 1
            ? "1 resultado encontrado."
            : dados.length +
              " resultados encontrados.";


    dados.forEach(
        function(tentativa) {

            const linha =
                document.createElement(
                    "tr"
                );


            const nome =
                tentativa.candidates &&
                tentativa.candidates.name
                    ? tentativa.candidates.name
                    : "Sem nome";


            const total =
                Number(
                    tentativa.total_questions
                ) || 0;


            const score =
                tentativa.score;


            /*
             * RACIOCÍNIO NUMÉRICO
             */

            if (
                testeAtual === "numerico"
            ) {

                let aproveitamento =
                    "—";


                if (
                    score !== null &&
                    score !== undefined &&
                    total > 0
                ) {

                    const percentual =
                        (
                            Number(score) /
                            total
                        ) * 100;


                    aproveitamento =
                        percentual.toFixed(1) +
                        "%";

                }


                linha.innerHTML = `

                    <td>
                        ${escaparHTML(nome)}
                    </td>

                    <td>
                        ${total}
                    </td>

                    <td>
                        ${
                            score === null ||
                            score === undefined
                                ? "—"
                                : escaparHTML(
                                    String(score)
                                  )
                        }
                    </td>

                    <td>

                        <span class="badge badge-aproveitamento">

                            ${aproveitamento}

                        </span>

                    </td>

                    <td>

                        <span class="badge">

                            Concluído

                        </span>

                    </td>

                `;

            }


            /*
             * NEGOCIAÇÃO
             */

            else {

                const classificacao =
                    tentativa.classification ||
                    "—";


                let classeBadge =
                    "badge";


                if (
                    classificacao ===
                    "Negociador razoável"
                ) {

                    classeBadge =
                        "badge badge-razoavel";

                }


                if (
                    classificacao ===
                    "Mau Negociador"
                ) {

                    classeBadge =
                        "badge badge-mau";

                }


                linha.innerHTML = `

                    <td>
                        ${escaparHTML(nome)}
                    </td>

                    <td>
                        ${total}
                    </td>

                    <td>
                        ${
                            score === null ||
                            score === undefined
                                ? "—"
                                : escaparHTML(
                                    String(score)
                                  )
                        }
                    </td>

                    <td>

                        <span class="${classeBadge}">

                            ${escaparHTML(
                                classificacao
                            )}

                        </span>

                    </td>

                    <td>

                        <span class="badge">

                            Concluído

                        </span>

                    </td>

                `;

            }


            tabela.appendChild(
                linha
            );

        }
    );

}


/* =====================================================
   LIMPAR PESQUISA
===================================================== */

function limparPesquisa() {

    document.getElementById(
        "pesquisaNome"
    ).value =
        "";


    filtrarResultados();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(
    texto
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        texto || "";


    return div.innerHTML;

}


/* =====================================================
   SAIR
===================================================== */

function sair() {

    sessaoNumerico =
        null;

    sessaoNegociacao =
        null;

    emailAdministrador =
        "";

    todosResultados =
        [];


    localStorage.removeItem(
        "painel_email"
    );

    localStorage.removeItem(
        "painel_numerico_token"
    );

    localStorage.removeItem(
        "painel_numerico_refresh"
    );

    localStorage.removeItem(
        "painel_negociacao_token"
    );

    localStorage.removeItem(
        "painel_negociacao_refresh"
    );


    document.getElementById(
        "painel"
    ).style.display =
        "none";


    document.getElementById(
        "login"
    ).style.display =
        "block";


    document.getElementById(
        "email"
    ).value =
        "";


    document.getElementById(
        "senha"
    ).value =
        "";


    document.getElementById(
        "mensagemLogin"
    ).textContent =
        "";


    document.getElementById(
        "pesquisaNome"
    ).value =
        "";

}


/* =====================================================
   RECUPERAR SESSÃO
===================================================== */

async function recuperarSessao() {

    const email =
        localStorage.getItem(
            "painel_email"
        );


    const tokenNumerico =
        localStorage.getItem(
            "painel_numerico_token"
        );


    const tokenNegociacao =
        localStorage.getItem(
            "painel_negociacao_token"
        );


    if (
        email &&
        tokenNumerico &&
        tokenNegociacao
    ) {

        emailAdministrador =
            email;


        sessaoNumerico = {

            access_token:
                tokenNumerico

        };


        sessaoNegociacao = {

            access_token:
                tokenNegociacao

        };


        mostrarPainel();

    }

}


/* =====================================================
   INICIAR
===================================================== */

recuperarSessao();

</script>
